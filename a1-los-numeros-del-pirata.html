body{display:grid;place-items:center;background:#F6F3EC;color:#14213A;font:500 17px/1.5 system-ui,'Segoe UI',sans-serif;padding:24px;box-sizing:border-box}
.caja{max-width:440px;text-align:center;display:grid;gap:16px;justify-items:center}

<div class="caja" id="caja" role="status" aria-live="polite">

  <div class="giro" aria-hidden="true"></div>
