<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vista previa · Lingua's Academy</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="canonical" href="https://linguasacademy.github.io/#muestras">
<!-- Las muestras sueltas se retiraron: ahora cada tablero tiene una vista previa real (vista/<nombre>.html).
     Esta página solo redirige los enlaces viejos (muestra.html?t=<nombre>&lang=…):
     a la vista previa del tablero si ya existe; si no, a la sección «Mira una clase por dentro» de la portada. -->
<noscript><meta http-equiv="refresh" content="0; url=./#muestras"></noscript>
<script src="vista/vistas.js?v=2026111802"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var t = (q.get('t') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  var lang = (q.get('lang') || '').toLowerCase();
  var sufijo = /^(es|en|pt)$/.test(lang) ? '?lang=' + lang : '';
  var vistas = Array.isArray(window.VISTAS) ? window.VISTAS : [];
  var destino = t && vistas.indexOf(t) !== -1 ? 'vista/' + t + '.html' + sufijo : './' + sufijo + '#muestras';
  location.replace(destino);
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F3EC;color:#14213A;font:400 17px/1.5 system-ui,sans-serif;padding:24px}a{color:#B93A28;font-weight:600}</style>
</head>
<body>
<p><a href="./#muestras">Ver una clase de muestra</a></p>
</body>
</html>
