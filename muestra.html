:root{
  --papel:#F5F2EC;--hoja:#FFFDF9;--tinta:#17223D;--tinta2:#2C3A5C;--ayuda:#5B6478;--linea:#D9D2C4;
  --terra:#C2533A;--mar:#1B7A88;--mostaza:#D6992A;--verde:#4A8656;--ciruela:#6D4B80;

  --ok:#2E8A4E;--okf:#DFF3E6;--mal:#C23B2E;--malf:#FBE2DE;

  --r:26px;--borde:2.5px solid var(--tinta);--sombra:5px 5px 0 var(--tinta);
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--papel);color:var(--tinta);font:400 17px/1.5 var(--sans);

  -webkit-tap-highlight-color:transparent}
body.ninos{font-size:20px}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;min-height:52px;margin-bottom:10px}
.top a{display:inline-flex;border-radius:50%;padding:4px}
.top img{width:40px;height:40px;display:block}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s18{width:18px;height:18px}
:focus-visible{outline:3px solid var(--mar);outline-offset:3px}
button{font:inherit;color:inherit}

.lamina{background:var(--hoja);border:var(--borde);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.cab{background:var(--terra);color:var(--hoja);padding:16px 22px 14px}
.cab-fila{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.cab h1{margin:0;font:400 clamp(1.25rem,3.6vw,1.6rem)/1.2 var(--serif);text-wrap:balance}
.cab h1 .pre{font:500 .62em/1 var(--mono);letter-spacing:.02em;opacity:.92;display:block;margin-bottom:6px}
.cont{font:500 .85rem/1 var(--mono);white-space:nowrap}
.prog{display:flex;gap:6px;margin-top:12px}
.prog span{flex:1;height:6px;border-radius:6px;background:rgba(255,253,249,.32);transition:background-color .3s var(--ease)}
.prog span.hecho{background:var(--hoja)}
.cuerpo{padding:22px 24px 24px}
@media (max-width:520px){.cuerpo{padding:18px 16px 18px}.cab{padding:14px 16px 12px}}

.sit{margin:0 0 14px;color:var(--ayuda)}
.mira{background:var(--mostazaf);border:2px solid var(--tinta);border-radius:18px;padding:12px 16px;margin-bottom:20px}
.mira-et{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85em;color:var(--tinta2);margin-bottom:4px}
.mira p{margin:4px 0}
.mira b{font-weight:600}
.mira .gl{color:var(--ayuda);display:block;font-size:.92em}

.consigna{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--tinta2);margin:0 0 8px}
.consigna svg{color:var(--mar)}
.item{outline:none}
.prompt{font:400 clamp(1.35rem,4.4vw,1.85rem)/1.35 var(--serif);margin:0 0 4px;overflow-wrap:anywhere}
.hueco{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--mar);color:var(--mar);text-align:center;line-height:1.1}
.glosa{color:var(--ayuda);margin:0 0 16px}

.ops{display:grid;gap:12px;margin:8px 0 0}
@media (min-width:560px){.ops.dos{grid-template-columns:1fr 1fr}}
.op{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 16px;background:var(--hoja);border:var(--borde);border-radius:16px;box-shadow:3px 3px 0 var(--tinta);font-size:1.08em;font-weight:500;cursor:pointer;text-align:center;

.op:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--tinta)}
.op:disabled{cursor:default}
.op.atenuada{opacity:.5}
.op.ok{background:var(--okf);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok);color:#1d5c34}
.op.mal{background:var(--malf);border-color:var(--mal);box-shadow:3px 3px 0 var(--mal);color:#8f2a20}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Movimiento: respuestas cortas a una acción, con salida suave (ease-out). */
.entra{animation:entra .24s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb{animation:aparece .2s var(--ease) both}
@keyframes aparece{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sacude{animation:sacude .28s var(--ease)}
@keyframes sacude{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.linea .ficha{animation:pone .16s var(--ease) both}
@keyframes pone{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/*LOGICA-INICIO*/
function norm(s){
  return String(s||"").toLowerCase().replace(/[¿?¡!.,;:"«»“”()]/g," ").replace(/\s+/g," ").trim();
}
function sinTildes(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,""); }
/* Completa: acepta mayúsculas y signos; si solo falla la tilde, la da por buena y avisa. */
function revisaCompleta(entrada, k){
  var lista = Array.isArray(k) ? k : [k], e = norm(entrada);
  if(!e) return {vacio:true, ok:false, tilde:false, respuesta:lista[0]};
  for(var i=0;i<lista.length;i++){ if(e===norm(lista[i])) return {ok:true, tilde:false, respuesta:lista[i]}; }
  for(i=0;i<lista.length;i++){ if(sinTildes(e)===sinTildes(norm(lista[i]))) return {ok:true, tilde:true, respuesta:lista[i]}; }
  return {ok:false, tilde:false, respuesta:lista[0]};
}
/* Ordena: fichas visibles (sin punto final y con minúscula inicial) */
function fichas(k){
  var t = String(k).trim().split(/\s+/);
  t[t.length-1] = t[t.length-1].replace(/\.$/,"");
  t[0] = t[0].replace(/^([¿¡]?)(\S)/, function(m,a,b){ return a + b.toLowerCase(); });
  return t;
}
function semilla(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function baraja(arr, seed){
  var a = arr.map(function(x,i){return i;}), s = seed || 1;
  function r(){ s = (Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  var igual = a.every(function(x,i){ return arr[x]===arr[i]; });
  if(igual && a.length>1) a.push(a.shift());
  return a;
}
function revisaOrden(elegidas, k){
  var t = fichas(k);
  return elegidas.length===t.length && elegidas.every(function(w,i){ return w===t[i]; });
}
/*LOGICA-FIN*/

var qs = new URLSearchParams(location.search);
var lang = (qs.get("lang")||"").toLowerCase();
if(!UI[lang]){ var nav = (navigator.language||"es").toLowerCase(); lang = nav.indexOf("pt")===0 ? "pt" : nav.indexOf("en")===0 ? "en" : "es"; }
var T = UI[lang];
document.documentElement.lang = lang;
var conLang = function(url){ var p = url.split("#"); return p[0] + (p[0].indexOf("?")<0?"?":"&") + "lang=" + lang + (p[1] ? "#" + p[1] : ""); };
document.getElementById("inicio").href = conLang("index.html");
document.getElementById("inicio").setAttribute("aria-label", T.inicio);

var MU = window.MUESTRAS || {}, CAT = window.CATALOGO || [];
var app = document.getElementById("app"), vivo = document.getElementById("vivo");

function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if(attrs) for(var a in attrs){
    if(a==="class") el.className = attrs[a];
    else if(a==="text") el.textContent = attrs[a];
    else if(a.indexOf("on")===0) el.addEventListener(a.slice(2), attrs[a]);
    else if(attrs[a]!==false && attrs[a]!=null) el.setAttribute(a, attrs[a]===true ? "" : attrs[a]);
  }
  (kids||[]).forEach(function(k){ if(k==null) return; el.appendChild(typeof k==="string" ? document.createTextNode(k) : k); });
  return el;
}
function ic(name, cls){
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","i"+(cls?" "+cls:"")); s.setAttribute("aria-hidden","true");
  s.innerHTML = ICON[name]; return s;
}
function fmt(s, o){ return s.replace(/\{(\w+)\}/g, function(m,k){ return o[k]; }); }
function meta(nombre, valor, prop){
  var el = document.querySelector('meta['+(prop?'property':'name')+'="'+nombre+'"]'); if(el) el.setAttribute("content", valor);
}
function infoDe(id){
  var c = CAT.filter(function(x){ return x.archivo===id+".html"; })[0] || {}, m = MU[id] || {};
  return {nivel:c.nivel||m.nivel, titulo:c.titulo||m.titulo, desc:c.desc||"", c:c.consignas||m.c||"es", ninos:(c.publico ? c.publico==="ninos" : !!m.ninos)};
}

/* ───────────── Lista de muestras ───────────── */
function lista(aviso){
  document.title = T.listaT + " · Lingua's Academy";
  meta("description", T.desc); meta("og:title", T.listaT + " · Lingua's Academy", true); meta("og:description", T.desc, true);
  var ids = Object.keys(MU), orden = ["A1","A2","B1","B2","C1","C2"];
  var cuerpo = h("div",{class:"cuerpo"},[
    aviso ? h("p",{class:"aviso", role:"status", text:aviso}) : null,
    h("p",{class:"lista-intro", text:T.listaIntro})
  ]);
  orden.forEach(function(nv){
    var deNivel = ids.filter(function(id){ return infoDe(id).nivel===nv; });
    if(!deNivel.length) return;
    var ul = h("ul",{class:"filas"});
    deNivel.forEach(function(id){
      var inf = infoDe(id), m = MU[id];
      ul.appendChild(h("li",null,[h("a",{href:conLang("muestra.html?t="+encodeURIComponent(id))},[
        h("span",null,[
          h("span",{class:"t", text:inf.titulo}),
          inf.desc ? h("span",{class:"d", text:inf.desc}) : null,
          h("span",{class:"tags"},[
            h("span",{class:"tag", text:T.tipos[m.tipo]}),
            h("span",{class:"tag", text:fmt(T.consignas,{l:T.lenguas[inf.c]})}),
            inf.ninos ? h("span",{class:"tag ninos", text:T.ninos}) : null
          ])
        ]),
        h("span",{class:"probar"},[ic("play","s18"), T.probar])
      ])]));
    });
    cuerpo.appendChild(h("h2",{class:"nivel"},[h("span",{class:"et", text:nv}), ""]));
    cuerpo.appendChild(ul);
  });
  app.replaceChildren(h("section",{class:"lamina"},[
    h("div",{class:"cab"},[h("h1",null,[T.listaT])]),
    cuerpo
  ]));
}

/* ───────────── Una muestra ───────────── */
function juego(id){
  var M = MU[id], inf = infoDe(id), F = FB[M.c||inf.c] || FB.es, N = M.items.length;
  var st = {i:0, aciertos:0};
  document.body.classList.toggle("ninos", inf.ninos);
  var titulo = inf.titulo + " · " + T.pagina + " · Lingua's Academy";
  document.title = titulo;
  var d = M.sit + " " + T.desc;
  meta("description", d); meta("og:title", titulo, true); meta("og:description", d, true);

  var cont = h("span",{class:"cont"}), prog = h("div",{class:"prog", "aria-hidden":"true"});
  for(var p=0;p<N;p++) prog.appendChild(h("span"));
  var cab = h("div",{class:"cab"},[
    h("div",{class:"cab-fila"},[
      h("h1",null,[h("span",{class:"pre", text:T.muestra + " · " + inf.nivel}), inf.titulo]),
      cont
    ]),
    prog
  ]);
  var zona = h("div");
  var cuerpo = h("div",{class:"cuerpo"},[
    h("p",{class:"sit", text:M.sit}),
    h("div",{class:"mira"},[h("div",{class:"mira-et"},[ic("eye","s18"), F.mira])].concat(M.muestra.map(function(l){
      return h("p",null,[h("b",{text:l.es}), h("span",{class:"gl", text:l.gl})]);
    }))),
    h("p",{class:"consigna"},[ic(M.tipo==="elige"?"mouse-pointer-click":M.tipo==="completa"?"pencil":"list-ordered"), M.consigna]),
    zona
  ]);
  app.replaceChildren(h("section",{class:"lamina"},[cab, cuerpo]));

  function marcaProgreso(){
    cont.textContent = Math.min(st.i+1,N) + " / " + N;
    cont.setAttribute("aria-label", fmt(T.item,{i:Math.min(st.i+1,N), n:N}));
    [].forEach.call(prog.children, function(s,j){ s.classList.toggle("hecho", j<st.i); });
  }
  function prompt(texto, relleno){
    var partes = texto.split("___"), el = h("p",{class:"prompt"});
    partes.forEach(function(t,j){
      el.appendChild(document.createTextNode(t));
      if(j<partes.length-1){ var hu = h("span",{class:"hueco"}); hu.textContent = relleno || " "; el.appendChild(hu); }
    });
    return el;
  }
  function caja(tipo, icono, titulo, textos){
    return h("div",{class:"fb "+tipo},[ic(icono), h("div",null,[h("p",{class:"fb-t", text:titulo})].concat(textos.filter(Boolean).map(function(t){ return h("p",{text:t}); })))]);
  }
  function anuncia(t){ vivo.textContent = ""; setTimeout(function(){ vivo.textContent = t; }, 30); }

  function item(enfocar){
    marcaProgreso();
    var it = M.items[st.i], intentos = 0, resuelto = false;
    var fbz = h("div"), pistaVista = false;
    var bPista = h("button",{class:"btn suave", type:"button", onclick:function(){
      if(resuelto || pistaVista) return; pistaVista = true; bPista.disabled = true;
      fbz.replaceChildren(caja("pista","lightbulb",F.pista,[it.h])); anuncia(F.pista+" "+it.h);
    }},[ic("lightbulb","s18"), T.pista]);
    var bReini = h("button",{class:"btn suave", type:"button", onclick:reinicia},[ic("rotate-ccw","s18"), T.reiniciar]);
    var bComp = h("button",{class:"btn prim", type:"button"},[ic("check","s18"), T.comprobar]);
    var ultimo = st.i===N-1;
    var bSig = h("button",{class:"btn prim", type:"button", hidden:true, onclick:function(){ st.i++; if(st.i<N) item(true); else cierre(); }},[T[ultimo?"resultado":"siguiente"], ic("arrow-right","s18")]);
    var acciones = h("div",{class:"acciones"},[h("div",{class:"izq"},[bReini, bPista]), h("div",{class:"der"},[bComp, bSig])]);
    var area = h("div",{class:"item entra", tabindex:"-1"});

    function fin(acierto, nodoFb){
      resuelto = true;
      if(acierto && intentos===1) st.aciertos++;
      fbz.replaceChildren.apply(fbz, nodoFb);
      bComp.hidden = true; bPista.disabled = true; bSig.hidden = false;
      anuncia(nodoFb.map(function(n){ return n.textContent; }).join(" "));
      bSig.focus({preventScroll:true});
    }
    function sacude(el){ el.classList.remove("sacude"); void el.offsetWidth; el.classList.add("sacude"); }

    if(M.tipo==="elige"){
      bComp.hidden = true;
      var ops = h("div",{class:"ops"+(it.o.length===2?" dos":"")});
      it.o.forEach(function(o,j){
        var b = h("button",{class:"op", type:"button", onclick:function(){
          if(resuelto) return; intentos++;
          var bien = j===it.k;
          [].forEach.call(ops.children, function(x,n){ x.disabled = true; if(n===it.k){ x.classList.add("ok"); x.prepend(ic("check","s18")); } else if(n!==j) x.classList.add("atenuada"); });
          if(!bien){ b.classList.add("mal"); b.prepend(ic("x","s18")); sacude(b); }
          fin(bien, bien ? [caja("ok","check",F.ok,[it.e])] : [caja("mal","x",F.mal,[F.resp+" "+it.o[it.k]+". "+it.e])]);
        }},[o]);
        if(it.og && it.og[j]) b.setAttribute("title", it.og[j]);
        ops.appendChild(b);
      });
      area.append(prompt(it.p), it.g ? h("p",{class:"glosa", text:it.g}) : null, ops);
    }

    if(M.tipo==="completa"){
      var pr = prompt(it.p);
      var inp = h("input",{type:"text", autocomplete:"off", autocapitalize:"none", spellcheck:"false", enterkeyhint:"done", placeholder:T.escribe, "aria-label":it.p.replace("___","…")});
      inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); revisa(); } });
      function revisa(){
        if(resuelto) return;
        var r = revisaCompleta(inp.value, it.k);
        if(r.vacio){ sacude(inp); inp.focus(); return; }
        intentos++;
        var hu = pr.querySelector(".hueco");
        if(r.ok){
          inp.classList.remove("mal"); inp.classList.add("ok"); inp.readOnly = true; hu.textContent = r.respuesta;
          var nodos = [caja("ok","check",F.ok,[it.e])];
          if(r.tilde) nodos.push(caja("tilde","lightbulb",F.tilde+" "+r.respuesta,[]));
          fin(true, nodos);
        } else if(intentos<2){
          inp.classList.add("mal"); sacude(inp);
          fbz.replaceChildren(caja("mal","x",F.mal,[F.pista+" "+it.h, F.otra]));
          anuncia(F.mal+" "+F.pista+" "+it.h); inp.select();
        } else {
          inp.classList.add("mal"); inp.readOnly = true; hu.textContent = r.respuesta;
          fin(false, [caja("mal","x",F.mal,[F.resp+" "+r.respuesta+". "+it.e])]);
        }
      }
      bComp.addEventListener("click", revisa);
      area.append(pr, it.g ? h("p",{class:"glosa", text:it.g}) : null, h("div",{class:"campo"},[inp]));
    }

    if(M.tipo==="ordena"){
      var t = fichas(it.k), ordenB = baraja(t, semilla(id+"#"+st.i));
      var linea = h("div",{class:"linea", role:"group", "aria-label":T.frase});
      var banco = h("div",{class:"banco", role:"group", "aria-label":T.palabras});
      var elegidas = [];
      function pinta(){
        linea.replaceChildren.apply(linea, elegidas.map(function(n, pos){
          return h("button",{class:"ficha", type:"button", disabled:resuelto, onclick:function(){
            if(resuelto) return; elegidas.splice(pos,1); linea.classList.remove("mal"); pinta();
            var b = banco.children[ordenB.indexOf(n)]; if(b) b.focus({preventScroll:true});
          }},[t[n]]);
        }));
        [].forEach.call(banco.children, function(b){
          var n = +b.dataset.n, usada = elegidas.indexOf(n)>=0;
          b.classList.toggle("usada", usada); b.disabled = usada || resuelto;
        });
        bComp.disabled = elegidas.length!==t.length;
      }
      ordenB.forEach(function(n){
        banco.appendChild(h("button",{class:"ficha", type:"button", "data-n":n, onclick:function(){
          if(resuelto) return; elegidas.push(n); pinta();
          var sig = [].filter.call(banco.children, function(b){ return !b.disabled; })[0];
          (sig || bComp).focus({preventScroll:true});
        }},[t[n]]));
      });
      var bBorrar = h("button",{class:"btn suave", type:"button", onclick:function(){ if(resuelto) return; elegidas = []; linea.classList.remove("mal"); pinta(); }},[ic("delete","s18"), T.borrar]);
      bComp.addEventListener("click", function(){
        if(resuelto || elegidas.length!==t.length) return;
        intentos++;
        var bien = revisaOrden(elegidas.map(function(n){ return t[n]; }), it.k);
        if(bien){ linea.classList.add("ok"); fin(true, [caja("ok","check",F.ok,[it.k, it.e])]); pinta(); }
        else if(intentos<2){
          linea.classList.add("mal"); sacude(linea);
          fbz.replaceChildren(caja("mal","x",F.mal,[F.pista+" "+it.h, F.otra])); anuncia(F.mal+" "+F.pista+" "+it.h);
        } else { fin(false, [caja("mal","x",F.mal,[F.resp+" "+it.k, it.e])]); pinta(); bBorrar.disabled = true; }
      });
      area.append(it.g ? h("p",{class:"glosa", text:it.g}) : null, linea, banco, h("div",{style:"margin-top:10px"},[bBorrar]));
      pinta();
    }

    area.append(fbz, acciones);
    zona.replaceChildren(area);
    if(enfocar){
      var primero = area.querySelector(".op, input, .banco .ficha");
      (primero || area).focus({preventScroll:true});
      cab.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }
  }

  function cierre(){
    st.i = N; marcaProgreso(); cont.textContent = N + " / " + N;
    var bReini = h("button",{class:"btn suave", type:"button", onclick:reinicia},[ic("rotate-ccw","s18"), T.reiniciar]);
    var area = h("div",{class:"cierre entra", tabindex:"-1"},[
      h("p",{class:"consigna", text:T.listo}),
      h("p",{class:"marcador", text:fmt(T.marcador,{a:st.aciertos, n:N})}),
      h("div",{class:"habla"},[ic("message-circle"), h("p",{text:M.habla})]),
      h("p",{class:"nota", text:T.nota}),
      h("div",{class:"salidas"},[
        h("a",{class:"btn terra", href:conLang("entrar.html")},[ic("key-round","s18"), T.acceso]),
        h("a",{class:"btn", href:conLang("index.html#tableros")},[ic("layout-grid","s18"), T.mas])
      ]),
      h("div",{class:"acciones"},[h("div",{class:"izq"},[bReini])])
    ]);
    zona.replaceChildren(area);
    area.focus({preventScroll:true});
    anuncia(fmt(T.marcador,{a:st.aciertos, n:N}) + ". " + M.habla);
  }
  function reinicia(){ st.i = 0; st.aciertos = 0; item(true); }

  item(false);
}

var id = (qs.get("t")||"").replace(/\.html$/,"");
if(id && MU[id] && MU[id].items && MU[id].items.length) juego(id);
else lista(id ? T.noHay : "");
})();
</script>
</body>
</html>
