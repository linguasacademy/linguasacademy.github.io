<!doctype html>
<html lang="es">
<head>
<script>/* Vista previa: sin sala en vivo. El tablero funciona solo en esta pantalla. */window.claude={use:async function(){return null}};window.LA_VISTA_PREVIA=true;</script>
<script src="../assets/sin-creditos.js?v=1" defer></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vista previa · Ayer fui…</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Estilo de Lingua's Academy: barra oscura flotante, mapa lateral claro con ficha-etiqueta, lámina de papel con borde de tinta, sombra dura y sellos. Un solo aspecto claro, a propósito: se comparte por videollamada. */
:root{
  --papel:#F5F2EC; --hoja:#FFFDF9; --tinta:#17223D; --tinta2:#2C3A5C; --ayuda:#5B6478; --linea:#D9D2C4;
  --terra:#C2533A; --mar:#1B7A88; --mostaza:#D6992A; --verde:#4A8656; --ciruela:#6D4B80;
  --terraf:#F8E3DC; --marf:#DDEFF1; --mostazaf:#FBEFD6; --verdef:#E1F0E3; --ciruelaf:#ECE3F2;
  --ok:#2E8A4E; --mal:#C23B2E; --okf:#DFF3E6; --malf:#FBE2DE;
  --display:'Young Serif',Georgia,'Times New Roman',serif;
  --texto:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:26px; --sombra:5px 5px 0 var(--tinta);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:500 19px/1.45 var(--texto);overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#17223D10 1px,transparent 0);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px}
.es{color:var(--tinta);font-weight:700}
.en{color:var(--ayuda);font-size:.86em;font-weight:500}
mark{background:var(--mostazaf);color:var(--terra);font-weight:700;padding:0 3px;border-radius:5px}

#app{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* ---- barra oscura flotante (40 px) ---- */
#top{grid-column:1/-1;height:40px;margin:6px 10px 0;border-radius:14px;display:flex;align-items:center;gap:8px;background:var(--tinta);color:#fff;padding-right:8px;box-shadow:0 4px 0 #0f1830}
#top button{color:#fff}
.tmenu{height:40px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px 0 8px!important;border-radius:14px 0 0 14px;background:var(--terra);font:400 16px var(--display);white-space:nowrap}
.tmenu svg{display:block;flex:none}
.plegado .tmenu span{display:none}
.tnav{display:flex;align-items:center;gap:2px}
.tnav button{height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:16px;font:600 15px var(--texto)}
.tnav button:hover{background:#ffffff1f}
.tnav button:disabled{opacity:.4;cursor:default}
.tnav i{width:22px;height:22px;font-size:11px;border-radius:50%;background:var(--mar);display:grid;place-items:center;font-style:normal;line-height:1}
.tprog{flex:1;min-width:0;display:flex;justify-content:center;gap:4px;overflow:hidden}
.tprog svg{flex:none}
.crono{font:600 14px var(--mono);height:28px;padding:0 10px!important;border-radius:9px;background:#ffffff1a;min-width:62px;font-variant-numeric:tabular-nums}
.crono.va{background:var(--mar)}
.crono.pasado{background:var(--terra)}
.guard{font:400 11px var(--mono);letter-spacing:.06em;opacity:.8;white-space:nowrap}
.guard.ok{color:#A9E7BF;opacity:1}
.tedit{height:28px;padding:0 12px!important;border-radius:9px;background:var(--mostaza);color:var(--tinta)!important;font:700 14px var(--texto)}
.editando .tedit{background:#fff}
.vivo{font:500 11px var(--mono);letter-spacing:.06em;white-space:nowrap;padding:3px 9px;border-radius:9px;background:#ffffff1a}
.vivo.on{background:var(--ok);color:#fff}
.vivo.off{opacity:.75}

/* ---- mapa lateral claro ---- */
#lado{grid-column:1;grid-row:2;margin:10px 0 10px 10px;border-radius:var(--r);background:var(--hoja);border:2.5px solid var(--tinta);box-shadow:var(--sombra);width:268px;overflow-y:auto;display:flex;flex-direction:column}
.plegado #lado{display:none}
.ficha{position:relative;margin:14px 14px 6px;padding:12px 14px;background:var(--mostazaf);border:2px solid var(--tinta);border-radius:16px;font-size:14.5px;line-height:1.35}
.ficha::before{content:none;position:absolute;left:8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--papel);border:2px solid var(--tinta)}
.ficha b{display:block;font:400 22px/1.1 var(--display)}
.ficha span{display:block;color:var(--tinta2)}
.indice{position:relative;padding:6px 0 10px;flex:1}
.indice::before{content:"";position:absolute;left:31px;top:24px;bottom:24px;border-left:2.5px dotted var(--linea)}
.it{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:5px 14px;color:var(--tinta)}
.it .pt{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;line-height:1;background:var(--hoja);border:2.5px solid var(--mcol);color:var(--mcol);font:400 15px var(--display)}
.it .tx{min-width:0;font:600 15px/1.15 var(--texto)}
.it .tx small{display:block;font:400 10px var(--mono);letter-spacing:.08em;color:var(--ayuda)}
.it:hover{background:#17223D0a}
.it.on{background:#17223D12}
.it.on .pt{background:var(--mcol);color:#fff}
.it.ok .pt{background:var(--ok);border-color:var(--ok);color:#fff}
.vaciar{margin:8px 14px 14px;padding:8px 10px!important;border:2px solid var(--linea)!important;border-radius:10px;font:400 11.5px var(--mono);letter-spacing:.05em;color:var(--ayuda)}
.vaciar.arma{background:var(--mal);border-color:var(--mal)!important;color:#fff}

/* ---- lámina ---- */
#escena{grid-column:2;grid-row:2;overflow:auto;padding:10px 12px 14px}
.lamina{--mcol:var(--mar);max-width:1140px;min-height:calc(100% - 4px);margin:0 auto;display:flex;flex-direction:column;background:var(--hoja);border:2.5px solid var(--tinta);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.cab{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 18px;background:var(--mcol);color:#fff;flex:none;border-bottom:2.5px solid var(--tinta)}
.cab .icono{flex:none;width:44px;height:44px;border-radius:50%;background:#ffffff26;border:2px dashed #ffffffaa;display:grid;place-items:center}
.cab h1{margin:0;font:400 clamp(19px,2.6vw,28px)/1.1 var(--display);text-wrap:balance}
.cab .sello-cab{margin-left:auto;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:2px solid #fff;border-radius:8px;padding:4px 8px;transform:rotate(-4deg);opacity:.9}
.tagrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:12px 18px 0}
.tag{font:600 12px var(--mono);letter-spacing:.12em;color:var(--mcol);border:2px solid var(--mcol);border-radius:999px;padding:3px 11px;background:var(--hoja)}
.tag i{font-style:normal;margin-left:6px}
.sub{font:400 clamp(18px,2.2vw,23px) var(--display);color:var(--tinta)}
.min{font:400 12px var(--mono);letter-spacing:.08em;color:var(--ayuda)}
.tabs{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.tabs button{min-width:42px;height:34px;padding:0 13px;border-radius:999px;border:2px solid var(--tinta);background:var(--hoja);font:700 16px var(--texto);display:grid;place-items:center;line-height:1}
.tabs button[aria-selected="true"]{background:var(--tinta);color:#fff}
.tabs button.extra{border-style:dashed}
.instr{display:flex;align-items:center;gap:10px;margin:12px 18px 0;padding:9px 14px;border-radius:14px;background:color-mix(in srgb,var(--mcol) 12%,var(--hoja));border:2px solid color-mix(in srgb,var(--mcol) 35%,var(--hoja));font:italic 500 17px var(--texto);color:var(--tinta)}
.instr svg{flex:none}
.panel{position:relative;flex:1;margin:14px 18px 0;min-height:300px}
.pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px 16px}
.hecha{margin-left:auto;height:44px;padding:0 20px!important;border-radius:999px;border:2.5px solid var(--tinta);background:var(--hoja);box-shadow:3px 3px 0 var(--tinta);font:700 17px var(--texto);display:flex;align-items:center;gap:8px}
.hecha:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.hecha.si{background:var(--verdef);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.hecha.si svg{animation:estampa .4s ease-out}
@keyframes estampa{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.editbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.editando .editbar{display:flex}
.editbar b{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ayuda)}
.chipadd{height:36px;padding:0 14px!important;border-radius:18px;border:2px dashed var(--mar)!important;color:var(--mar)!important;font:600 14px var(--texto);background:#fff!important}
.reini{height:36px;padding:0 14px!important;border-radius:18px;border:2px solid var(--linea)!important;font:600 13.5px var(--texto);color:var(--ayuda)!important;background:var(--hoja)!important}

/* ---- piezas comunes ---- */
.btn{min-height:46px;padding:0 22px;border-radius:999px;background:var(--mar);color:#fff;border:2.5px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);font:700 17px var(--texto)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.btn.sol{background:var(--mostaza);color:var(--tinta)}
.btn.terra{background:var(--terra)}
.mini{min-height:36px;padding:0 14px;border-radius:999px;border:2px solid var(--linea);font:600 14.5px var(--texto);color:var(--ayuda);background:var(--hoja)}
.fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.hueco{flex:1}
.fb{min-height:34px;margin-top:12px;padding:7px 14px;border-radius:12px;font-weight:600;font-size:17.5px}
.fb:empty{padding:0}
.fb.ok{background:var(--okf);color:#1D5E35}
.fb.mal{background:var(--malf);color:#8E2419}
.pts{font:700 17px var(--texto);display:inline-flex;align-items:center;gap:6px}
h2.t{margin:0 0 6px;font:400 clamp(24px,3.3vw,34px)/1.12 var(--display);text-wrap:balance}
p.lead{margin:0 0 14px;max-width:62ch}
.rutas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ruta{padding:6px 14px;border-radius:12px;background:var(--marf);border:2px dashed var(--mar);font:700 19px var(--texto)}
.ruta small{display:block;font:500 13.5px var(--texto);color:var(--ayuda)}
.dicho{margin:6px 0 0;font:400 clamp(21px,2.6vw,26px)/1.3 var(--display)}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiembla{animation:tiembla .25s 2}
@keyframes sube{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.entra{animation:sube .3s ease-out}
.eco{animation:eco .9s ease-out}
@keyframes eco{0%{box-shadow:0 0 0 0 #D6992A}30%{box-shadow:0 0 0 7px #D6992A}100%{box-shadow:0 0 0 0 #D6992A00}}

/* foto con baldosas (intro) */
.foto{position:relative;border-radius:18px;overflow:hidden;border:2.5px solid var(--tinta);max-width:100%;background:var(--marf)}
.foto img{display:block;width:100%;height:auto}
.baldosas{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr)}
.bald{position:relative;background:var(--mar);border:1.5px solid var(--hoja);transition:transform .35s,opacity .35s}
.bald::before{content:"";position:absolute;inset:14%;border-radius:50%;border:3px solid #ffffff66;background:radial-gradient(circle,var(--mostaza) 0 18%,transparent 19%)}
.bald::after{content:"";position:absolute;inset:0;background:conic-gradient(from 45deg,#ffffff14 0 25%,transparent 0 50%,#ffffff14 0 75%,transparent 0)}
.bald:nth-child(3n){background:var(--terra)}.bald:nth-child(4n){background:var(--tinta2)}
.bald.fuera{transform:rotateY(90deg) scale(.6);opacity:0;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chip{min-height:42px;padding:0 16px;border-radius:999px;background:var(--hoja);border:2.5px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);font:700 18px var(--texto)}
.chip.visto{background:var(--mostazaf)}
.pop-foto{display:block;width:100%;border-radius:14px;border:2px solid var(--tinta);margin:4px 0 12px;max-height:46vh;object-fit:cover}

/* V/F */
.vf{display:grid;gap:10px}
.vfila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;border:2px solid var(--linea);background:var(--hoja)}
.vfila p{margin:0;flex:1;min-width:220px;font-weight:600}
.vfila .op{min-height:42px;font-size:16px}
.vfila.listo{border-color:var(--ok);background:var(--okf)}
.metas{display:grid;gap:10px;margin:10px 0 14px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px 16px;border-radius:16px;border:2px solid var(--tinta);background:var(--hoja)}
.meta .n{width:44px;height:44px;border-radius:50%;border:2.5px dashed var(--terra);color:var(--terra);display:grid;place-items:center;font:400 22px var(--display);transform:rotate(-8deg)}
.meta .es{display:block;font:400 clamp(20px,2.6vw,25px)/1.25 var(--display)}
.final-task{padding:12px 16px;border-radius:16px;background:var(--mostazaf);border:2px solid var(--mostaza)}

/* pasaporte de sellos (MUESTRA) */
.pasaporte{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px;border-radius:18px;background:var(--papel);border:2px solid var(--linea);background-image:repeating-linear-gradient(0deg,transparent 0 27px,#17223D0c 27px 28px)}
.sello{--c:var(--terra);position:relative;min-height:122px;padding:12px 10px;border-radius:16px;border:3px double var(--c);color:var(--c);background:var(--hoja);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;transform:rotate(var(--g,-2deg));transition:transform .2s}
.sello:hover{transform:rotate(0) scale(1.03)}
.sello b{font:400 19px/1.15 var(--display);color:var(--tinta)}
.sello small{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.sello.redondo{border-radius:50%;aspect-ratio:1;min-height:0}
.sello.visto{background:color-mix(in srgb,var(--c) 14%,var(--hoja))}
.ejs{display:grid;gap:8px;margin:12px 0 4px}
.ejs p{margin:0;padding:8px 12px;border-left:4px solid var(--mar);background:var(--marf);border-radius:0 10px 10px 0;font:600 19px/1.35 var(--texto)}
.ejs p span{display:block;font:500 14.5px var(--texto);color:var(--ayuda)}
.glosa-big{font:400 clamp(26px,3.6vw,34px)/1.1 var(--display);margin:0}
.glosa-en{font-size:19px;color:var(--ayuda);margin:4px 0 0}

/* tarjetas que giran */
.regla{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.regla span{padding:5px 12px;border-radius:10px;background:var(--papel);border:2px solid var(--linea);font:600 16px var(--texto)}
.cartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tarjeta{display:block;perspective:900px;height:150px;width:100%}
.cara{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.tarjeta.vuelta .cara{transform:rotateY(180deg)}
.frente,.dorso{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:absolute;top:0;right:0;bottom:0;left:0;border-radius:16px;padding:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;transition:opacity .25s .12s;border:2.5px solid var(--tinta)}
.frente{background:var(--tinta);color:#fff}
.frente b{font:400 27px/1 var(--display)}
.frente i{font:500 14px var(--texto);font-style:normal;opacity:.75}
.frente em{position:absolute;top:8px;right:10px;font-style:normal;color:var(--mostaza)}
.dorso{background:var(--mostazaf);transform:rotateY(180deg);opacity:0}
.dorso b{font:400 27px/1 var(--display);color:var(--terra)}
.dorso span{font-size:14.5px;font-weight:600;line-height:1.25}
.tarjeta.vuelta .dorso{opacity:1}
.tarjeta.vuelta .frente{opacity:0}

/* páginas */
.pager{position:relative;padding:0 58px;min-height:300px;display:flex;flex-direction:column;justify-content:center}
.pg{display:none}.pg.on{display:block}
.flecha{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--hoja)!important;border:2.5px solid var(--tinta)!important;box-shadow:2px 2px 0 var(--tinta);font:700 22px var(--texto);display:grid;place-items:center;line-height:1}
.flecha.izq{left:0}.flecha.der{right:0}
.flecha:disabled{opacity:.3;cursor:default}
.npag{text-align:center;font:400 12px var(--mono);color:var(--ayuda);margin-top:10px}
.escala{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.escala div{padding:10px;border-radius:12px;background:var(--papel);border:2px solid var(--linea);text-align:center;font:700 18px var(--texto)}
.escala div span{display:block;font:500 13px var(--texto);color:var(--ayuda)}
.lista-check{display:grid;gap:6px;margin:12px 0}
.lista-check p{margin:0;font:600 21px var(--texto)}
.contraste{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.contraste div{padding:12px 14px;border-radius:14px;border:2px solid var(--linea)}
.contraste h3{margin:0 0 6px;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ayuda)}

/* elección, orden, caza */
.frase{font:400 clamp(23px,3.2vw,32px)/1.3 var(--display);margin:8px 0 14px}
.ops{display:flex;flex-wrap:wrap;gap:10px}
.op{min-height:50px;padding:6px 18px;border-radius:14px;border:2.5px solid var(--tinta);background:var(--hoja);font:600 19px var(--texto);line-height:1.2;text-align:left}
.op.ok{border-color:var(--ok);background:var(--okf)}
.op.mal{border-color:var(--mal);background:var(--malf)}
.item-lista{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.item-lista img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2.5px solid var(--tinta);flex:none}
.casilla{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:2.5px solid var(--tinta);font:700 20px var(--texto);margin-right:8px;vertical-align:-6px}
.casilla.si{background:var(--verdef);color:var(--ok)}.casilla.no{background:var(--hoja);color:var(--mal)}
.glosa-ord{font-size:17px;color:var(--ayuda);margin-bottom:8px}
.linea{min-height:60px;border-bottom:3px solid var(--tinta);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;margin-bottom:14px}
.banco{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tok{min-height:46px;padding:0 15px;border-radius:12px;border:2px solid var(--tinta);background:var(--marf);font:600 20px var(--texto);line-height:1}
.linea .tok{background:var(--mostazaf)}
.caza{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.caza button{min-height:50px;padding:0 16px;border-radius:12px;border:2px dashed var(--linea);background:var(--hoja);font:600 22px var(--texto)}
.caza button.mal{border:2.5px solid var(--mal);background:var(--malf);text-decoration:line-through}
.caza button.bien{border:2.5px solid var(--ok);background:var(--okf)}
.caza button.no{opacity:.45}

/* foto con puntos (actividad 3) */
.puntos{position:relative;border-radius:18px;overflow:hidden;border:2.5px solid var(--tinta)}
.puntos img{display:block;width:100%;height:auto}
.pto{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:var(--terra);color:#fff;border:3px solid #fff;box-shadow:0 2px 8px #0006;font:700 18px var(--texto);display:grid;place-items:center;line-height:1}
.pto.visto{background:var(--verde)}
.pto::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #fff;opacity:.8;animation:late 2s infinite}
.pto.visto::after{display:none}
@keyframes late{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.vecesq{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.vecesq img{display:block;width:100%;border-radius:16px;border:2.5px solid var(--tinta)}
.veces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.veces button{min-height:52px;border-radius:14px;border:2.5px solid var(--tinta);background:var(--hoja);font:700 18px var(--texto)}
.veces button.sel{background:var(--mostaza)}
.respuesta{padding:10px 14px;border-radius:14px;background:var(--mostazaf);border:2px solid var(--mostaza)}

/* libro / blog */
.libro{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);border-radius:18px;overflow:hidden;border:2.5px solid var(--tinta);background:var(--hoja);min-height:320px}
.libro.solo{grid-template-columns:1fr}
.libro .ilu{background:var(--papel);border-right:2.5px solid var(--tinta)}
.libro .ilu img{display:block;width:100%;height:100%;object-fit:cover}
.libro .hoja{position:relative;padding:22px clamp(16px,3vw,34px) 58px;display:flex;flex-direction:column;justify-content:center}
.libro .tit{font:400 clamp(25px,3.2vw,34px)/1.1 var(--display);margin:0}
.libro .aut{font:400 12.5px var(--mono);letter-spacing:.05em;color:var(--ayuda);margin:6px 0 0}
.libro .txt p{margin:0 0 .5em;font:500 var(--fs,23px)/1.5 var(--texto)}
.libro .nav{position:absolute;left:0;right:0;bottom:10px;display:flex;align-items:center;justify-content:center;gap:16px}
.libro .nav button{width:42px;height:42px;border-radius:50%;background:var(--tinta);color:#fff;font:700 18px var(--texto);display:grid;place-items:center;line-height:1}
.libro .nav button:disabled{opacity:.25;cursor:default}
.libro .nav span{font:400 12.5px var(--mono);color:var(--ayuda)}
@keyframes hoja{from{transform:translateX(14px);opacity:.2}to{transform:none;opacity:1}}
.libro .txt.pasa{animation:hoja .3s ease-out}
.leer{font:500 22px/1.75 var(--texto);max-width:64ch}
.leer button{font:inherit;border-bottom:3px solid var(--mostaza);padding:0 2px;border-radius:4px 4px 0 0}
.leer button.fr{border-bottom-color:var(--mar)}
.leer button.listo{background:var(--okf);border-bottom-color:var(--ok)}
.cajas{display:grid;gap:10px}
.caja{border-radius:16px;border:2.5px solid var(--tinta);overflow:hidden;background:var(--hoja)}
.caja>button{width:100%;text-align:left;padding:12px 16px;font:400 21px var(--display);display:flex;gap:12px;align-items:center}
.caja>button i{font:700 16px var(--texto);font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--mostaza);display:grid;place-items:center;flex:none;line-height:1}
.caja .den{display:none;padding:0 16px 14px}
.caja.abierta .den{display:block}
.caja.abierta{background:var(--mostazaf)}

/* juego: duelo de cartas */
.marcador{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:stretch}
.jug{flex:1;min-width:130px;border-radius:16px;border:2.5px solid var(--linea);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 19px var(--texto)}
.jug b{font:400 36px/1 var(--display);font-variant-numeric:tabular-nums}
.jug.turno{border-color:var(--tinta);background:var(--mostazaf);box-shadow:3px 3px 0 var(--tinta)}
.mesa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.mazo{position:relative;width:130px;height:180px;border-radius:16px;border:2.5px solid var(--tinta);background:var(--terra);color:#fff;box-shadow:4px 4px 0 var(--tinta),8px 8px 0 #c2533a55;font:400 18px/1.2 var(--display);display:grid;place-items:center;text-align:center;padding:10px}
.mazo:disabled{opacity:.35;cursor:default}
.mazo small{display:block;font:600 11px var(--mono);margin-top:6px;letter-spacing:.08em}
.carta{border-radius:18px;border:2.5px solid var(--tinta);background:var(--hoja);padding:16px 18px;min-height:180px;box-shadow:var(--sombra)}
.carta .q{font:400 clamp(23px,3vw,31px)/1.2 var(--display);margin:0}
.paso-j{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ayuda);margin:12px 0 6px}
.final{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--mostazaf);border:2.5px solid var(--tinta)}

/* mi lista */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{position:relative;min-height:78px;padding:10px 12px 10px 14px;border-radius:14px;border:2.5px solid var(--linea);background:var(--hoja);text-align:left;font:700 18px/1.2 var(--texto)}
.tile small{display:block;font:500 13.5px var(--texto);color:var(--ayuda);margin-top:3px}
.tile em{position:absolute;right:8px;top:-10px;font:600 11px var(--mono);font-style:normal;letter-spacing:.06em;padding:3px 8px;border-radius:8px;border:2px solid var(--tinta);background:var(--hoja);transform:rotate(4deg)}
.tile.s1{border-color:var(--mar);background:var(--marf)}.tile.s1 em{background:var(--mar);color:#fff}
.tile.s2{border-color:var(--ok);background:var(--verdef)}.tile.s2 em{background:var(--ok);color:#fff}
.tile.s3{border-color:var(--terra);background:var(--terraf)}.tile.s3 em{background:var(--terra);color:#fff}
.leyenda{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:15px}
.leyenda span{padding:3px 10px;border-radius:8px;font-weight:700}
.dichos{margin-top:12px;padding:12px 16px;border-radius:16px;border:2.5px solid var(--tinta);background:var(--papel)}

/* resumen y tarea */
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tresb{border-radius:18px;border:2.5px solid var(--tinta);background:var(--hoja);box-shadow:3px 3px 0 var(--tinta);padding:14px;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:6px}
.tresb b{font:400 22px/1.15 var(--display)}
.tresb .den{display:none}
.tresb.abierta{background:var(--mostazaf)}
.tresb.abierta .den{display:block}
.aprendi{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.aprendi li{padding-left:30px;position:relative;font-weight:600}
.aprendi li svg{position:absolute;left:0;top:3px;color:var(--ciruela)}
.dias{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dia{border-radius:18px;border:2.5px solid var(--tinta);background:var(--hoja);text-align:left;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.dia b{font:400 24px var(--display)}
.dia .den{visibility:hidden}
.dia.abierta{background:var(--verdef)}
.dia.abierta .den{visibility:visible}

/* bloques añadidos */
.imgdesc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.imgdesc .marco{border-radius:16px;overflow:hidden;border:2.5px solid var(--tinta);background:var(--papel)}
.imgdesc .marco img{display:block;width:100%;height:auto;max-height:56vh;object-fit:contain}
.orden{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dado{width:86px;height:86px;border-radius:20px;background:var(--terra)!important;color:#fff!important;border:2.5px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);font:400 48px/1 var(--display);display:grid;place-items:center}
@keyframes rueda{to{transform:rotate(360deg)}}
.dado.gira{animation:rueda .5s}
.preg{font:400 clamp(22px,3vw,30px)/1.15 var(--display);margin-top:6px}
.video{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.poster{position:relative;aspect-ratio:16/9;border-radius:16px;background:var(--tinta);display:grid;place-items:center;color:#fff;text-decoration:none;overflow:hidden;border:2.5px solid var(--tinta)}
.poster::before{content:"";width:86px;height:86px;border-radius:50%;background:var(--terra);box-shadow:0 0 0 10px #ffffff2e}
.poster::after{content:"";position:absolute;border:19px solid transparent;border-left:30px solid #fff;border-right:0;margin-left:8px}
.poster em{position:absolute;left:12px;bottom:10px;font:400 12.5px var(--mono);font-style:normal;background:#000000a0;padding:2px 8px;border-radius:6px}
.video .tiempos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.video .tiempos span{font:500 14px var(--mono);padding:4px 10px;border-radius:8px;background:var(--papel)}
.video a.btn{display:inline-flex;align-items:center;text-decoration:none}
.vacio{border:2.5px dashed var(--linea);border-radius:16px;padding:26px;text-align:center;color:var(--ayuda)}
.herr{display:none;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.editando .herr{display:flex}

/* ventana */
#velo{position:fixed;inset:0;background:#17223Dcc;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.popup{position:relative;background:var(--hoja);border:2.5px solid var(--tinta);border-radius:var(--r);max-width:600px;width:100%;max-height:92%;overflow:auto;padding:24px 24px 20px;box-shadow:8px 8px 0 #0b1226;animation:abre .28s ease-out}
@keyframes abre{from{transform:scale(.92) rotate(-1deg);opacity:0}to{transform:none;opacity:1}}
.popup .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--terra);color:#fff;border:2px solid var(--tinta);font:700 18px/1 var(--texto);display:grid;place-items:center}
.popup h3{margin:0 44px 10px 0;font:400 25px/1.15 var(--display)}
.popup label{display:block;font:700 15px var(--texto);margin:10px 0 3px}
.popup label small{font-weight:500;color:var(--ayuda)}
.popup input[type=text],.popup textarea,.popup select{width:100%;font:500 16px var(--texto);padding:9px 12px;border:2px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
.popup textarea{min-height:120px;resize:vertical}
.popup .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.popup .err{color:var(--mal);font-weight:700;font-size:15px;min-height:20px;margin-top:6px}

/* el estudiante sigue; el profe conduce */
.alumno #bAnt,.alumno #bSig,.alumno #bInicio,.alumno #bEditar,.alumno #crono,.alumno #guard,.alumno .vaciar,.alumno #bHecha,.alumno .reini,.alumno .editbar,.alumno .herr{display:none!important}
.alumno .tabs button,.alumno .it,.alumno .flecha,.alumno .libro .nav button{pointer-events:none}
.alumno .flecha,.alumno .libro .nav button{opacity:.35}

@media (max-width:900px){
  body{font-size:17.5px}
  #app:not(.plegado) #lado{position:fixed;margin:0;top:calc(52px + env(safe-area-inset-top,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:15;width:min(268px,86vw)}
  .tmenu span,.tnav span,.guard,.tedit span,.reini{display:none}
  .tprog{display:none}
  #top{gap:3px;margin:6px 8px 0}
  .crono{margin-left:auto}
  .imgdesc,.libro,.video,.vecesq,.mesa,.contraste{grid-template-columns:1fr}
  .libro .ilu{border-right:0;border-bottom:2.5px solid var(--tinta);max-height:190px;overflow:hidden}
  .pager{padding:0 0 60px}
  .flecha{top:auto;bottom:0;transform:none}
  .tres,.dias{grid-template-columns:1fr}
  .escala{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cab .sello-cab{display:none}
  #escena{padding:8px max(8px,env(safe-area-inset-right,0px)) 12px max(8px,env(safe-area-inset-left,0px))}
  .panel,.instr{margin-left:12px;margin-right:12px}
  .tagrow,.pie{padding-left:12px;padding-right:12px}
  .mazo{width:100%;height:auto;min-height:70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- piezas de esta clase ---- */
.tnav i svg,.tmenu svg{display:block}
.tnav i{background:var(--mar)}
.it .pt svg{display:block}
.cab .icono{color:#fff}
.dado span{font:400 48px/1 var(--display)}
.hecha svg,.btn svg,.mini svg,.chip svg,.op svg{vertical-align:-4px}
.mini{display:inline-flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.fb{display:flex;align-items:flex-start;gap:8px}
.fb svg{flex:none;margin-top:3px}
.contador{font:600 13px var(--mono);letter-spacing:.06em;color:var(--ayuda)}

/* diálogo línea a línea */
.dialogo{display:grid;gap:8px;max-width:820px}
.dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start;padding:8px 12px;border-radius:14px;border:2px solid var(--linea);background:var(--hoja)}
.dl.yo{background:var(--marf);border-color:var(--mar)}
.dl .quien{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ayuda);padding-top:6px}
.dl.yo .quien{color:var(--mar)}
.dl .es{display:block;font:400 clamp(20px,2.5vw,24px)/1.3 var(--display);font-weight:400}
.dl .en{display:block}
.dl .acot{display:block;font:italic 500 14px var(--texto);color:var(--ayuda)}

/* tarjetas de bloques */
.cartas.anchas{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.cartas.anchas .tarjeta{height:170px}
.cartas.anchas .frente b{font-size:23px;line-height:1.15}
.cartas.anchas .dorso b{font-size:17px;line-height:1.2;color:var(--tinta)}
.cartas.anchas .dorso span{font-size:14px;color:var(--tinta2)}

/* series de un ítem */
.serie-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cuenta{font:600 13px var(--mono);letter-spacing:.08em;color:var(--ayuda)}
.situ{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--marf);border:2px solid var(--mar);margin:6px 0 14px;font-weight:600;font-size:19px}
.situ svg{flex:none;color:var(--mar)}

/* escribir */
.escribe{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font:400 clamp(22px,3vw,30px)/1.4 var(--display);margin:8px 0 6px}
.campo{font:600 19px var(--texto);color:var(--tinta);min-height:50px;padding:6px 14px;border:2.5px solid var(--tinta);border-radius:12px;background:#fff;width:min(260px,100%)}
.campo.ok{border-color:var(--ok);background:var(--okf)}
.campo.mal{border-color:var(--mal);background:var(--malf)}
.area{display:block;width:100%;min-height:150px;font:500 19px/1.5 var(--texto);color:var(--tinta);padding:12px 14px;border:2.5px solid var(--tinta);border-radius:16px;background:#fff;resize:vertical}
.checks{display:grid;gap:6px;margin:10px 0;padding:0;list-style:none}
.checks li{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--tinta2)}
.checks li .cx{width:26px;height:26px;border-radius:8px;border:2px solid var(--linea);display:grid;place-items:center;color:transparent;flex:none;background:var(--hoja)}
.checks li.si .cx{border-color:var(--ok);background:var(--okf);color:var(--ok)}
.escr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}

/* interruptor tú / usted */
.interr{display:inline-flex;border:2.5px solid var(--tinta);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.interr button{min-height:44px;padding:0 22px;font:700 18px var(--texto)}
.interr button[aria-pressed="true"]{background:var(--tinta);color:#fff}
.pares{display:grid;gap:10px}
.par{padding:12px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--hoja)}
.par .es{display:block;font:400 clamp(22px,2.8vw,27px)/1.3 var(--display);font-weight:400}

/* chat (lectura) */
.chat{max-width:720px;display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--papel);border:2px solid var(--linea)}
.chat .grupo{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:2px dashed var(--linea);font:400 20px var(--display)}
.chat .grupo small{display:block;font:500 13px var(--texto);color:var(--ayuda)}
.burb{max-width:88%;padding:8px 14px 10px;border-radius:16px 16px 16px 4px;background:var(--hoja);border:2px solid var(--tinta);font:500 20px/1.55 var(--texto)}
.burb.der{justify-self:end;border-radius:16px 16px 4px 16px;background:var(--verdef)}
.burb b{display:block;font:600 12px var(--mono);letter-spacing:.06em;color:var(--terra);text-transform:uppercase}
.gl{font:inherit;border-bottom:3px solid var(--mostaza)!important;padding:0!important;border-radius:4px 4px 0 0!important}
.gl.visto{background:var(--mostazaf)!important}
.pie-foto{font:400 12px var(--mono);color:var(--ayuda);margin:6px 2px 0}

/* tres en raya */
.ttt-zona{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cel{position:relative;min-height:104px;padding:10px 8px;border-radius:16px;border:2.5px solid var(--tinta);background:var(--hoja);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font:600 14.5px/1.2 var(--texto)}
.cel svg{color:var(--mar)}
.cel.sel{background:var(--mostazaf);box-shadow:3px 3px 0 var(--tinta)}
.cel.E{background:var(--marf);border-color:var(--mar)}
.cel.P{background:var(--terraf);border-color:var(--terra)}
.cel .ficha-j{font:400 30px/1 var(--display)}
.cel.E .ficha-j{color:var(--mar)}.cel.P .ficha-j{color:var(--terra)}
.cel:disabled{cursor:default}

/* orden (resumen) */
.listo-frase{font:400 clamp(22px,3vw,28px)/1.3 var(--display)}

/* ruta del curso */
.camino{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.etapa{border-radius:18px;border:2.5px solid var(--tinta);background:var(--hoja);padding:14px;display:flex;flex-direction:column;gap:6px}
.etapa.hoy{background:var(--verdef);box-shadow:3px 3px 0 var(--tinta)}
.etapa small{font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--ayuda);text-transform:uppercase}
.etapa b{font:400 22px/1.15 var(--display)}
.etapa ul{margin:4px 0 0;padding-left:18px;font-size:16.5px}
.mision{display:grid;gap:10px}
.paso-m{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:12px 16px;border-radius:16px;border:2.5px solid var(--tinta);background:var(--hoja)}
.paso-m .ico-m{width:44px;height:44px;border-radius:50%;background:var(--verdef);border:2px solid var(--tinta);display:grid;place-items:center;color:var(--verde)}
.paso-m b{font:400 21px/1.2 var(--display)}

/* ranking */
.rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rk{position:relative;min-height:64px;padding:10px 14px 10px 54px;border-radius:14px;border:2.5px solid var(--linea);background:var(--hoja);text-align:left;font:700 18px/1.2 var(--texto)}
.rk small{display:block;font:500 14px var(--texto);color:var(--ayuda)}
.rk .num{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:2px dashed var(--linea);display:grid;place-items:center;font:400 18px var(--display);color:var(--ayuda)}
.rk.on{border-color:var(--terra);background:var(--terraf)}
.rk.on .num{border:2px solid var(--terra);background:var(--terra);color:#fff}

@media (max-width:900px){
  .dl{grid-template-columns:1fr;gap:2px}.dl .quien{padding-top:0}
  .ttt-zona,.escr,.camino{grid-template-columns:1fr}
  .cel{min-height:88px;font-size:13.5px}
}

/* ===== piezas de «Ayer fui…» ===== */
.pistas{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.pistas li{padding:10px 14px;border-radius:14px;border:2px solid var(--linea);background:var(--hoja);display:flex;flex-direction:column;gap:2px}
.pistas li .es{font-size:20px}
.pistas li .en{font-size:15px;color:var(--ayuda)}
.pistas li.tapada{border-style:dashed;color:var(--ayuda);font:600 15px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.tapa-foto{min-height:220px;border-radius:var(--r);border:2px dashed var(--linea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ayuda);text-align:center;padding:16px}
.tlinea{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tflecha{color:var(--ayuda);display:inline-flex}
.tchip{font-size:18px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.vchip{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;min-height:58px;font-size:18px;width:100%}
.contraste2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.contraste2>div{padding:12px 16px;border-radius:14px;background:var(--marf);border:2px solid var(--mar);display:flex;flex-direction:column;gap:2px}
.contraste2 .es{font-size:21px}
.resena-cab{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:10px;border-radius:14px;background:var(--hoja);border:2px solid var(--linea)}
.resena-cab b{display:block;font:500 22px/1.15 var(--display)}
.resena-cab small{color:var(--ayuda);font-size:14px}
.estrellas{margin-left:auto;color:var(--naranja);display:inline-flex;gap:2px}
.resena .es{font-size:21px;line-height:1.6;font-weight:400}
.parejas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.parejas>div{display:flex;flex-direction:column;gap:8px}
.parejas .op{width:100%}
.op.sel{border-color:var(--naranja);background:var(--terraf)}
.cartas3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0}
.c3{position:relative;padding:16px 12px 14px;border-radius:14px;border:2.5px solid var(--tinta);background:var(--hoja);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--mar)}
.c3 .es{color:var(--tinta);font-size:19px}
.c3 .n{position:absolute;top:8px;left:10px;font:600 14px var(--mono);color:var(--ayuda)}
.tres-ok{display:flex;gap:10px}
.punto{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--linea);background:var(--hoja);color:transparent;display:inline-flex;align-items:center;justify-content:center}
.punto.on{border-color:var(--ok);background:var(--okf);color:var(--ok)}
@media (max-width:560px){.parejas{grid-template-columns:1fr}}
.estrellas svg{fill:currentColor}

/* ===== Estilo de la web de Lingua's Academy (assets/tokens.css · site.css) ===== */
:root{
  --papel:#F3F0E7; --hoja:#FFFFFF; --tinta:#1E3F2F; --tinta2:#2C4A3B; --ayuda:#4A6558; --linea:#D3D9D0;
  --terra:#C45E2E; --mar:#2B6E9B; --mostaza:#6B7A1E; --verde:#2F7A3C; --ciruela:#6B3FA0;
  --terraf:#F8E5DA; --marf:#E3F1FB; --mostazaf:#F1F5DA; --verdef:#E2F1E4; --ciruelaf:#EDE4F7;
  --ok:#2F7A3C; --mal:#B03A2E; --okf:#E2F1E4; --malf:#FBE4E0;
  --lima:#C6D86B; --naranja:#D96C38; --cielo:#7EBFE9;
  --display:'Newsreader','Iowan Old Style',Georgia,serif;
  --texto:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:20px; --sombra:4px 4px 0 var(--tinta);
}
body{background:var(--papel);background-image:none;font-weight:400}
.es{font-weight:600}
mark{background:var(--lima);color:var(--tinta)}
h2.t,.cab h1,.sub,.glosa-big,.frase,.dicho,.preg,.carta .q,.libro .tit,.ficha b,.meta .es{letter-spacing:-.018em}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline-color:var(--naranja)}
#top{background:var(--tinta);box-shadow:none}
.tmenu{background:var(--tinta);border-right:1px solid #ffffff22}
.tnav i{background:var(--naranja);color:var(--tinta)}
.tedit{background:var(--lima)}
.crono.va{background:var(--mar)}
.ficha{background:var(--lima);border-color:var(--tinta)}
.chip.visto,.caja.abierta,.tresb.abierta,.dorso{background:var(--mostazaf)}
.btn.sol{background:var(--lima);color:var(--tinta)}
.btn{background:var(--naranja);color:var(--tinta)}
.btn.terra{background:var(--mal);color:#fff}
.dado{background:var(--naranja)!important;color:var(--tinta)!important}
.final-task,.final{background:var(--mostazaf)}
.final-task{border-color:var(--mostaza)}
.ruta{background:var(--marf);border-color:var(--mar)}
.gl{border-bottom-color:var(--naranja)!important}

/* barra de menú: se oculta y aparece al acercar el ratón arriba (en pantallas táctiles queda fija) */
#zonaTop{display:none}
@media (hover:hover) and (pointer:fine){
  #app{grid-template-rows:minmax(0,1fr)}
  #lado,#escena{grid-row:1}
  #zonaTop{display:block;position:fixed;left:0;right:0;top:0;height:18px;z-index:30}
  #top{position:fixed;left:0;right:0;top:0;z-index:31;transform:translateY(calc(-100% - 10px));transition:transform .22s cubic-bezier(.23,1,.32,1)}
  #zonaTop:hover+#top,#top:hover,#top:focus-within,body.verTop #top{transform:none}
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:reduce){#top{transition:none}}

/* el tablero ocupa toda la ventana y las fotos se ven enteras */
.lamina{max-width:none}
#escena{padding:10px 12px 12px}
.foto{width:fit-content;max-width:100%;margin:0 auto}
.foto img{width:auto;max-width:100%;max-height:min(58vh,640px);object-fit:contain}
.pop-foto{object-fit:contain;max-height:52vh;background:var(--papel)}
.libro .ilu img{object-fit:contain}
.imgdesc .marco img{max-height:62vh;object-fit:contain}
.escr .foto img{max-height:40vh}

const cache=new Map();
const guard=$('#guard');
const marca=(t,c)=>{guard.textContent=t;guard.className='guard '+(c||'')};
function escritor(ruta,datos,ms=500){let t=null,ocupado=false,sucio=false;
  async function ya(){if(ocupado){sucio=true;return}ocupado=true;
    try{await db.doc(ruta).set(JSON.parse(JSON.stringify(datos())));marca('GUARDADO','ok')}catch(e){marca('SOLO ESTA SESIÓN')}
    ocupado=false;if(sucio){sucio=false;ya()}}
  return()=>{if(aplicando)return;if(!db){marca('SOLO ESTA SESIÓN');return}marca('GUARDANDO…');clearTimeout(t);t=setTimeout(ya,ms)}}
const _gE=escritor('sesion/estado',()=>estado,60),_gC=escritor('sesion/contenido',()=>contenido);
const guardar=()=>{if(aplicando||VIVO.rol==='alumno')return;estado.actualizado=Date.now();_gE()};
const guardarContenido=()=>{if(VIVO.rol==='alumno')return;contenido.actualizado=Date.now();_gC()};
async function guardarMedia(id,d){mediaMem.set(id,d);if(db){try{await db.doc('media/'+id).set({d})}catch(e){marca('SOLO ESTA SESIÓN')}}}
async function leerMedia(id){if(mediaMem.has(id))return mediaMem.get(id);if(!db)return null;
  try{const s=await db.doc('media/'+id).get();if(s.exists){const d=s.data().d;mediaMem.set(id,d);return d}}catch(e){}return null}
async function conectar(){
  const usar=async n=>{try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}};
  const user=await usar('user');
  if(user){let ed=false;try{ed=await user.canEdit()}catch(e){}VIVO.rol=ed?'profe':'alumno'}
  db=await usar('db');
  if(!db){VIVO.rol='solo';marca('SOLO ESTA SESIÓN');return}
  marca('GUARDADO','ok');
  document.body.classList.toggle('alumno',VIVO.rol==='alumno');
  let primera=true;
  db.doc('sesion/estado').onSnapshot(s=>{
    if(!s.exists){if(primera&&VIVO.rol==='profe')guardar();primera=false;return}
    primera=false;if(s.metadata.hasPendingWrites)return;const d=s.data();
    if(!d||!(d.actualizado>estado.actualizado))return;
    const antes=estado;aplicando=true;estado=Object.assign(nuevoEstado(),JSON.parse(JSON.stringify(d)));
    if(estado.ep!==antes.ep){cache.clear();for(const k in TAB)delete TAB[k]}
    else for(const b of new Set([...Object.keys(estado.rein||{}),...Object.keys(antes.rein||{})]))
      if((estado.rein[b]||0)!==((antes.rein||{})[b]||0))cache.delete(b);
    if(estado.pantalla!==antes.pantalla)reiniciaCrono();
    if(VIVO.rol==='alumno'&&!velo.hidden&&(estado.pantalla!==antes.pantalla||estado.tab!==antes.tab))cerrar();
    pintar();if(VIVO.rol==='alumno'){$('#escena').scrollTop=0;presencia()}aplicando=false},()=>marca('SOLO ESTA SESIÓN'));
  db.doc('sesion/contenido').onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const d=s.data();
    if(!d||!(d.actualizado>contenido.actualizado))return;
    contenido=Object.assign({extras:{},fijos:{}},JSON.parse(JSON.stringify(d)));cache.clear();pintar()},()=>{});
  if(VIVO.rol!=='solo'){cache.clear();for(const k in TAB)delete TAB[k];pintar()}
  const room=await usar('room');
  if(room&&VIVO.rol!=='solo'){VIVO.room=room;room.onPeers(()=>{VIVO.rol==='profe'?leerAlumnos():leerProfe()},()=>{VIVO.room=null;pintaVivo()});presencia()}
  pintaVivo();
}

/* ================= en vivo: espejo de clics ================= */
const TAB={};let colaP=[],colaE=[],miSeq=0;const visto={};const espera=[];
const claveDe=(s,t)=>{const b=s.id+'/'+t.k;return{b,f:b+'|'+estado.ep+'.'+((estado.rein||{})[b]||0)}};
const claveActual=()=>{const s=SECS[estado.pantalla],t=tabsDe(s)[estado.tab]||tabsDe(s)[0];return claveDe(s,t)};
const baseDe=f=>f.split('|')[0];
const docLog=f=>'vivo/'+f.replace(/[^A-Za-z0-9_-]/g,'_');
const paso=f=>{const T=TAB[f];if(!T)return;semilla(f+'#'+T.n);T.n++};
function ruta(el,root){const a=[];while(el&&el!==root){const p=el.parentElement;if(!p)return null;a.unshift([...p.children].indexOf(el));el=p}return el===root?a.join('.'):null}
function nodoDe(r,root){let el=root;for(const i of String(r).split('.').filter(x=>x!==''))el=el&&el.children[+i];return el||null}
const conForm=()=>!velo.hidden&&!!$('input,textarea,select',popC);
function aplicar(f,p,eco){
  if(conForm()){espera.push(()=>aplicar(f,p,eco));return}
  const b=baseDe(f);paso(f);
  if(p==='X'){if(!velo.hidden)cerrar();return}
  if(p.startsWith('I:')){const k=p.indexOf('\u0001'),el=nodoDe(p.slice(2,k),cache.get(b));if(el&&'value' in el){el.value=p.slice(k+1);el.dispatchEvent(new Event('input',{bubbles:true}))}return}
  if(p.startsWith('@pg:')){const n=cache.get(b);if(n&&n._pager)n._pager.mover(+p.slice(4));return}
  if(p[0]==='V'&&velo.hidden)return;
  const root=p[0]==='V'?popC:cache.get(b),el=root&&nodoDe(p.slice(2),root);
  if(!el)return;
  if(eco){el.classList.add('eco');setTimeout(()=>el.classList.remove('eco'),900)}
  el.click()}
const _logT={};
function guardaLog(f){if(!db)return;clearTimeout(_logT[f]);_logT[f]=setTimeout(()=>{const T=TAB[f];if(T)db.doc(docLog(f)).set({acts:T.log.slice(-800)}).catch(()=>{})},300)}
function enviar(f,p){const T=TAB[f];if(!T)return;
  if(VIVO.rol==='profe'){const e={g:++T.g,p,o:'P'};T.log.push(e);colaP.push(Object.assign({k:f},e));colaP=colaP.slice(-20);presencia();guardaLog(f)}
  else if(VIVO.rol==='alumno'){colaE.push({s:++miSeq,k:f,p});colaE=colaE.slice(-20);presencia()}}
function presencia(){const r=VIVO.room;if(!r)return;
  const d=VIVO.rol==='profe'?{rol:'P',cola:colaP}:{rol:'E',sid:VIVO.sid,k:claveActual().f,cola:colaE};
  r.presence(d).catch(()=>{})}
async function cargarLog(f){
  const T=TAB[f];let acts=[];
  try{const s=await db.doc(docLog(f)).get();if(s.exists)acts=(s.data()||{}).acts||[]}catch(e){}
  if(TAB[f]!==T)return;
  for(const a of acts){aplicar(f,a.p,false);T.g=a.g}
  T.log=acts.slice();T.listo=true;
  VIVO.rol==='profe'?leerAlumnos():leerProfe()}
function leerAlumnos(){const r=VIVO.room;if(!r)return;let n=0,cambio=false;const act=claveActual().f;
  for(const p of r.peers()){const pr=p.presence||{};if(p.isMe||pr.rol!=='E')continue;n++;
    const cola=Array.isArray(pr.cola)?pr.cola:[],sid=String(pr.sid||p.peer);
    if(!(sid in visto)){visto[sid]=cola.reduce((m,e)=>Math.max(m,+e.s||0),0);continue}
    for(const e of cola){if(!(+e.s>visto[sid]))continue;visto[sid]=+e.s;
      const T=TAB[e.k];if(!T||!T.listo||e.k!==act||typeof e.p!=='string')continue;
      aplicar(e.k,e.p,true);const x={g:++T.g,p:e.p,o:sid};T.log.push(x);colaP.push(Object.assign({k:e.k},x));cambio=true;guardaLog(e.k)}}
  if(cambio){colaP=colaP.slice(-20);presencia()}
  pintaVivo(n)}
let _resync=null;
function leerProfe(){const r=VIVO.room;if(!r)return;
  const pf=r.peers().find(p=>!p.isMe&&p.presence&&p.presence.rol==='P');pintaVivo(pf?1:0);if(!pf)return;
  const cola=Array.isArray(pf.presence.cola)?pf.presence.cola:[];
  for(const e of cola){const T=TAB[e.k];if(!T||!T.listo||!(+e.g>T.g)||typeof e.p!=='string')continue;
    if(+e.g>T.g+1){if(!_resync)_resync=setTimeout(()=>{_resync=null;const b=baseDe(e.k);if(claveActual().f===e.k){cache.delete(b);delete TAB[e.k];pintar()}},700);continue}
    T.g=+e.g;if(e.o!==VIVO.sid)aplicar(e.k,e.p,false)}}
function pintaVivo(n){const v=$('#vivo');
  if(n===undefined&&VIVO.room)n=VIVO.room.peers().filter(p=>!p.isMe&&p.presence&&p.presence.rol===(VIVO.rol==='profe'?'E':'P')).length;
  if(VIVO.rol==='solo'||!VIVO.room){v.hidden=true;return}v.hidden=false;
  if(VIVO.rol==='profe'){v.className='vivo '+(n?'on':'off');v.textContent=n?'● ESTUDIANTE EN LÍNEA':'○ SIN ESTUDIANTE'}
  else{v.className='vivo '+(n?'on':'off');v.textContent=n?'● EL PROFE CONDUCE':'○ ESPERANDO AL PROFE'}}
const BLOQ='.flecha,.libro .nav button,.tabs button,#bHecha,.herr,.editbar,.it,#bVaciar,.reini,#bAnt,#bSig,#bInicio,#bEditar,#crono';

  paso(c.f);enviar(c.f,p)},true);
window.addEventListener('input',e=>{
  if(!e.isTrusted||VIVO.rol==='solo')return;const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName))return;
  const c=claveActual(),T=TAB[c.f],nodo=cache.get(c.b);if(!nodo||!nodo.contains(t)||!T||!T.listo)return;

  const ex=extrasDe(s.id).map(b=>({k:'x'+b.id,lab:ICX[b.tipo],extra:b,instr:TXT[b.tipo],r:(el,api)=>rExtra(el,api,b,s)}));

function paginar(texto,max){
  const paras=String(texto).replace(/\r/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean),pags=[];let cur=[],len=0;
  for(const p of paras){const fr=p.match(/[^.!?…]+[.!?…]+["»”’)]*\s*|[^.!?…]+$/g)||[p];let buf='';const tr=[];
    for(const f of fr){if((buf+f).length>max&&buf){tr.push(buf.trim());buf=f}else buf+=f}
    if(buf.trim())tr.push(buf.trim());
    for(const t of tr){if(len+t.length>max&&cur.length){pags.push(cur);cur=[];len=0}cur.push(t);len+=t.length}}
  if(cur.length)pags.push(cur);return pags.length?pags:[['']]}
function rLibro(root,api,c,ilu){
  const max={corta:150,media:340,larga:700}[c.pag||'corta']||150,pags=c.paginas||paginar(c.texto,max);let i=-1;
  root.innerHTML=`<div class="libro ${ilu?'':'solo'}" style="--fs:${max<200?23:max<500?21:19}px">${ilu?`<div class="ilu">${ilu}</div>`:''}<div class="hoja"><div class="txt"></div><div class="nav"><button class="a" aria-label="Previous page">${ic('chevron-left',20)}</button><span></span><button class="s" aria-label="Next page">${ic('chevron-right',20)}</button></div></div></div>`;
  const tx=$('.txt',root),a=$('.a',root),s=$('.s',root);
  function ver(){tx.classList.remove('pasa');void tx.offsetWidth;tx.classList.add('pasa');
    tx.innerHTML=i<0?`<h2 class="tit">${esc(c.titulo||'')}</h2><p class="aut">${esc(c.autor||'')}${c.fuente?' · '+esc(c.fuente):''}</p>`:pags[i].map(p=>`<p>${esc(p)}</p>`).join('');
    a.disabled=i<0;s.disabled=i===pags.length-1;$('.nav span',root).textContent=i<0?'':(i+1)+' / '+pags.length}
  const mover=d=>{const n=i+d;if(n<-1||n>=pags.length)return false;i=n;ver();return true};
  a.onclick=()=>mover(-1);s.onclick=()=>mover(1);api.pager({mover});ver()}
function rCajas(root,items){
  root.innerHTML=`<div class="cajas">${items.map((q,k)=>`<div class="caja"><button><i>${k+1}</i><span>${q.t}</span></button><div class="den">${q.d}</div></div>`).join('')}</div>`;

function ytId(u){const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?m[1]:null}
function aSeg(t){t=String(t||'').trim();if(!t)return 0;const p=t.split(':').map(Number);if(p.some(isNaN))return 0;return p.reduce((a,b)=>a*60+b,0)}
const mmss=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
function herr(root,s,b){

  else{const ru=String(b.rutas||'').split('\n').map(x=>x.trim()).filter(Boolean);
    root.innerHTML=`<h2 class="t" style="font-size:clamp(27px,4.2vw,44px)">${esc(b.texto||'')}</h2>${ru.length?`<div class="rutas">${ru.map(r=>`<span class="ruta">${esc(r)}</span>`).join('')}</div>`:''}`}
  herr(root,s,b)}

function comprimir(file){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=ko;fr.onload=()=>{const img=new Image();img.onerror=ko;img.onload=()=>{
  let max=1280,q=.82,d='';for(let k=0;k<7;k++){const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if(d.length<230000)break;max=Math.round(max*.82);q=Math.max(.6,q-.05)}
  ok(d)};img.src=fr.result};fr.readAsDataURL(file)})}

function editarBloque(s,b,nuevo,alGuardar){
  const F=FORM[b.tipo];let dataImg=null;
  abrir(`<h3>${F.t}</h3>${F.c}<div class="err" id="f_err"></div><div class="fila"><span class="hueco"></span><button class="mini" id="f_no">Cancelar</button><button class="btn" id="f_ok">Guardar</button></div>`);
  F.k.forEach(k=>{const e=$('#f_'+k);if(e&&b[k]!=null)e.value=b[k]});
  const err=m=>$('#f_err').textContent=m;
  if(b.tipo==='imagen'){const pv=$('#f_prev');
    const toma=async f=>{if(!f||!/^image\//.test(f.type)){err('Ese archivo no es una imagen.');return}err('Preparando la imagen…');try{dataImg=await comprimir(f);pv.innerHTML=`<img src="${dataImg}" alt="" style="max-height:150px;border-radius:10px">`;err('')}catch(e){err('No pude leer esa imagen. Prueba con JPG o PNG.')}};
    $('#f_file').onchange=e=>toma(e.target.files[0]);
    popC.onpaste=e=>{const f=[...(e.clipboardData&&e.clipboardData.files||[])][0];if(f){e.preventDefault();toma(f)}};
    if(b.media)leerMedia(b.media).then(d=>{if(d&&!dataImg)pv.innerHTML=`<img src="${d}" alt="" style="max-height:150px;border-radius:10px">`})}
  $('#f_no').onclick=cerrar;
  $('#f_ok').onclick=async()=>{
    const v={};F.k.forEach(k=>v[k]=$('#f_'+k).value.trim());
    if(b.tipo==='video'&&!ytId(v.url))return err('Pega un enlace de YouTube completo (youtube.com/watch?v=… o youtu.be/…).');
    if(b.tipo==='imagen'&&!dataImg&&!b.media)return err('Elige una imagen primero.');
    if(b.tipo==='cuento'&&!v.texto)return err('Pega el texto del cuento.');
    if(b.tipo==='pregunta'&&!v.texto)return err('Escribe la pregunta.');
    Object.assign(b,v);
    if(dataImg){b.media=uid();await guardarMedia(b.media,dataImg)}
    if(alGuardar){alGuardar(b)}
    else{if(nuevo){b.id=uid();(contenido.extras[s.id]=extrasDe(s.id)).push(b)}
      cache.clear();if(nuevo)estado.tab=tabsDe(s).length-1}
    cerrar();pintar();guardarContenido()}}

    if (!el || el.closest("#vp-cinta, #vp-fin, #vp-lado")) return false;
    var b = el.closest("button, a, [role=button]"); if (!b) return false;
    var id = (b.id || "") + " " + (b.getAttribute("data-accion") || "") + " " + (b.getAttribute("aria-label") || "") + " " + (b.getAttribute("title") || "");
    var txt = (b.textContent || "").trim();
    return /(^|\s)(bSig|bSiguiente|sig|siguiente|next)(\s|$)/i.test(id) || /^siguiente\b/i.test(id.trim()) || /^(siguiente|next|próximo)\b/i.test(txt);
  }
  function vigila(){
    var antes = firma();
    setTimeout(function(){ if (!dlg.open && firma() === antes) abrir(); }, 220);
  }
  document.addEventListener("click", function(e){ if (esSiguiente(e.target)) vigila(); }, true);
  document.addEventListener("keydown", function(e){
    if (e.key !== "ArrowRight" || e.altKey || e.ctrlKey || e.metaKey || dlg.open) return;
    var a = document.activeElement; if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return;
    vigila();
  }, true);
  /* si el tablero apaga «Siguiente» en la última pantalla, se deja encendido para llegar a la lámina final */
  function encender(){
    document.querySelectorAll("button[disabled], [aria-disabled=true]").forEach(function(b){
      if (esSiguiente(b)) { b.disabled = false; b.removeAttribute("aria-disabled"); }
    });
  }
  new MutationObserver(encender).observe(document.body, { attributes: true, subtree: true, attributeFilter: ["disabled", "aria-disabled"] });
  encender();
})();
</script>
