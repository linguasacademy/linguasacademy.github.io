<!doctype html>
<html lang="es">
<head>
<script>/* Vista previa: sin sala en vivo. El tablero funciona solo en esta pantalla. */window.claude={use:async function(){return null}};window.LA_VISTA_PREVIA=true;</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1F1A">
<title>Vista previa · Un café, por favor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Lámina de aula: barra de visor arriba, mapa de ruta a la izquierda y una sola lámina con pestañas y páginas.
   Aspecto único (claro) a propósito: se comparte por videollamada. */
:root{
  --tinta:#2A1F1A; --noche:#33261F; --noche2:#1E1511; --teal:#0F766E; --teal2:#14A096; --agua:#EDE3D3;
  --papel:#FFFFFF; --gris:#F6F0E6; --linea:#DDD0BB; --rojo:#D8382C; --sol:#EFB23A; --coral:#D2603F;
  --indigo:#2F6690; --hoja:#3B8751; --ambar:#A56C06; --ayuda:#5F564E;
  --ok:#1B8F52; --mal:#CF3527; --okf:#DDF3E6; --malf:#FBE2DE;
  --f1:#D9E8F6; --f2:#DDEFD9; --f3:#FBE1C8;            /* un · frases · una */
  --esc:#1D5C9E; --mid:#2A6B27; --acc:#9A4A0B;
  --display:'Fraunces','Georgia','Times New Roman',serif;
  --texto:'Figtree','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body{height:100%}
body{margin:0;background:var(--agua);color:var(--tinta);font:400 18px/1.5 var(--texto);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .12s var(--ease-out)}
button:active:not(:disabled){transform:scale(.97)}
a{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
.es{color:var(--tinta);font-weight:700}
.en{color:var(--ayuda);font-size:.86em;font-weight:400}
.mono{font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;font-size:12px}

#app{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

/* ---- barra del visor ---- */
#top{grid-column:1/-1;height:54px;display:flex;align-items:center;gap:10px;background:var(--tinta);color:#fff;padding-right:12px}
#top button{color:#fff}
.tmenu{height:54px;width:272px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px!important;background:var(--teal);font:700 17px var(--display)}
.plegado .tmenu{width:60px;justify-content:center;padding:0!important}
.plegado .tmenu span{display:none}
.tmenu svg{display:block;flex:none}
.tnav{display:flex;align-items:center;gap:4px;margin-left:6px}
.tnav button{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:20px;font:700 16px var(--display)}
.tnav button:disabled{opacity:.4;cursor:default}
.tnav i{width:28px;height:28px;border-radius:50%;background:var(--teal2);display:grid;place-items:center;font-style:normal;line-height:1;font-size:13px}
.tprog{flex:1;min-width:0;display:flex;justify-content:center;gap:3px;overflow:hidden}

.crono{font:700 16px var(--mono);height:36px;padding:0 12px!important;border-radius:8px;background:#ffffff1a;min-width:78px;font-variant-numeric:tabular-nums}
.crono.va{background:var(--teal2)}
.crono.pasado{background:var(--rojo)}
.guard{font:400 11px var(--mono);letter-spacing:.04em;opacity:.8;white-space:nowrap}
.guard.ok{color:#9BE8BF;opacity:1}
.tedit{height:36px;padding:0 14px!important;border-radius:8px;background:var(--sol);color:var(--tinta)!important;font:800 15px var(--display);white-space:nowrap}
.editando .tedit{background:#fff}

/* ---- mapa lateral ---- */
#lado{background:var(--noche);color:#fff;width:272px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.plegado #lado{width:60px}
.ficha{padding:14px 16px 10px;border-bottom:1px solid #ffffff22;font-size:14.5px;line-height:1.4}
.ficha b{display:block;font:800 23px/1.1 var(--display)}
.ficha span{display:block;color:#D3C7BA}
.plegado .ficha{display:none}
.indice{position:relative;padding:10px 0;flex:1}
.indice::before{content:"";position:absolute;left:29px;top:26px;bottom:26px;border-left:3px dashed #ffffff3a}
.it{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:5px 12px;color:#fff}
.it .pt2{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;line-height:1;background:var(--noche2);border:3px solid var(--mcol);font:800 15px var(--display)}
.it .tx{min-width:0;font:600 15.5px/1.15 var(--texto)}
.it .tx small{display:block;font:400 10px var(--mono);letter-spacing:.06em;color:#BDB0A3}
.it.on{background:#ffffff1c}
.it.on .pt2{background:var(--mcol);color:#fff}
.it.ok .pt2{background:var(--ok);border-color:var(--ok)}
.plegado .it{width:60px;height:46px;padding:0;display:grid;place-items:center}
.plegado .it .tx{display:none}
.vaciar{margin:8px 12px 14px;padding:8px 10px!important;border:1px solid #ffffff55!important;border-radius:8px;font:400 12px var(--mono);letter-spacing:.04em;color:#fff}
.vaciar.arma{background:var(--rojo);border-color:var(--rojo)!important}
.plegado .vaciar{display:none}

/* ---- lámina ---- */
#escena{overflow:auto;padding:12px 16px}
.lamina{--mcol:var(--teal);max-width:1140px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--gris);border-radius:14px;overflow:hidden;box-shadow:0 6px 22px #2A1F1A22}
.cab{display:flex;align-items:stretch;min-height:54px;background:var(--tinta);color:#fff;flex:none}
.cab .icono{width:86px;flex:none;background:var(--mcol);display:grid;place-items:center;clip-path:polygon(0 0,84% 0,100% 50%,84% 100%,0 100%)}
.cab h1{margin:0;padding:6px 14px;align-self:center;font:800 clamp(20px,2.5vw,28px)/1.1 var(--display);letter-spacing:.01em;text-wrap:balance}
.tagrow{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 14px;padding:10px 14px 0 0}
.tag{display:flex;align-items:center;gap:8px;background:var(--mcol);color:#fff;font:700 13px var(--mono);letter-spacing:.08em;padding:6px 22px 6px 16px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.tag i{font-style:normal;background:#ffffff40;border-radius:4px;padding:0 7px}
.sub{font:700 19px var(--display);color:var(--mcol);filter:brightness(.8);min-width:0;overflow-wrap:anywhere}
.min{font:400 12px var(--mono);letter-spacing:.06em;color:var(--ayuda);padding-bottom:3px}
.tabs{margin-left:auto;display:flex;gap:4px;align-self:flex-end;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-width:50px;height:36px;padding:0 12px;border-radius:10px 10px 0 0;background:#6F635B;color:#fff;font:800 18px var(--display);display:grid;place-items:center;line-height:1}
.tabs button[aria-selected="true"]{background:var(--papel);color:var(--tinta);height:40px}
.tabs button.extra{background:var(--teal)}
.tabs button.extra[aria-selected="true"]{background:var(--papel);color:var(--teal)}
.instr{display:flex;align-items:center;gap:8px;padding:5px 16px 7px;font:italic 400 17px var(--texto);color:var(--tinta)}
.instr svg{flex:none}
.panel{position:relative;flex:1;margin:0 12px;background:var(--papel);border-radius:10px;padding:18px clamp(14px,3vw,32px);min-height:300px;min-width:0}
.pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px 12px}
.hecha{margin-left:auto;height:44px;padding:0 20px!important;border-radius:22px;background:var(--tinta);color:#fff!important;font:800 17px var(--display);display:flex;align-items:center;gap:8px}
.hecha.si{background:var(--ok)}
.editbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.editando .editbar{display:flex}
.editbar b{font:400 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ayuda)}
.chipadd{height:38px;padding:0 14px!important;border-radius:19px;border:2px dashed var(--teal)!important;color:var(--teal)!important;font:700 15px var(--texto);background:#fff!important}

/* ---- piezas comunes ---- */
.btn{min-height:46px;padding:0 22px;border-radius:23px;background:var(--teal);color:#fff;font:800 18px var(--display)}
.btn.sol{background:var(--sol);color:var(--tinta)}
.mini{min-height:38px;padding:0 14px;border-radius:19px;border:2px solid var(--linea);font:600 15px var(--texto);color:var(--ayuda);background:#fff}
.fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.hueco{flex:1}
.fb{min-height:34px;margin-top:12px;padding:7px 14px;border-radius:10px;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.fb:empty{padding:0}
.fb.ok{background:var(--okf);color:#0D5F35}
.fb.mal{background:var(--malf);color:#96241A}
.pts{font:800 18px var(--display);color:var(--tinta);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
h2.t{margin:0 0 6px;font:800 clamp(25px,3.1vw,36px)/1.1 var(--display);text-wrap:balance;overflow-wrap:anywhere}
p.lead{margin:0 0 14px;max-width:62ch;overflow-wrap:anywhere}
.rutas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ruta{padding:6px 14px;border-radius:10px;background:#F1F6F5;border:2px solid var(--linea);font:800 22px var(--display);overflow-wrap:anywhere;min-width:0}
.ayudabtn{min-height:38px;padding:0 14px;border-radius:19px;border:2px dashed var(--linea);font:600 15px var(--texto);color:var(--ayuda);background:#fff;margin-top:8px}
.dicho{margin:6px 0 0;font:800 clamp(22px,2.7vw,28px)/1.25 var(--display);overflow-wrap:anywhere}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiembla{animation:tiembla .2s 2}
.fam{display:inline-block;padding:1px 10px;border-radius:8px;font-weight:700}
.fam.f1,.f1{background:var(--f1)} .fam.f2,.f2{background:var(--f2)} .fam.f3,.f3{background:var(--f3)}
.ej .fam.f1{color:var(--esc)} .ej .fam.f2{color:var(--mid)} .ej .fam.f3{color:var(--acc)}

/* tarjetas que giran */
.cartas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tarjeta{display:block;perspective:900px;height:156px;width:100%}
.tarjeta:active:not(:disabled){transform:none}
.cara{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s var(--ease-in-out)}
.tarjeta.vuelta .cara{transform:rotateY(180deg)}
.frente,.dorso{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:absolute;top:0;right:0;bottom:0;left:0;border-radius:14px;padding:8px 10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;transition:opacity .2s .1s}
.frente{background:var(--tinta);color:#fff;border-bottom:8px solid var(--fc)}
.frente b{font:800 clamp(22px,2.6vw,30px)/1.1 var(--display)}
.frente i{font:400 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:#D3C7BA}
.frente em{font-style:normal;font-size:30px;line-height:1}
.dorso{background:#fff;border:3px solid var(--fc);transform:rotateY(180deg);opacity:0}
.dorso b{font:700 18px/1.1 var(--texto);color:var(--ayuda)}
.dorso i{font:400 10.5px/1.25 var(--mono);color:var(--ayuda);font-style:normal}
.dorso span{font:800 20px/1.15 var(--display)}
.dorso span small{display:block;font:400 13px/1.2 var(--texto);color:var(--ayuda)}
.tarjeta.vuelta .dorso{opacity:1}
.tarjeta.vuelta .frente{opacity:0}
.leyenda{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px}

/* presentación por páginas */
.pager{position:relative;padding:0 58px;min-height:300px;display:flex;flex-direction:column;justify-content:center}
.pg{display:none}.pg.on{display:block}
.flecha{position:absolute;top:50%;margin-top:-23px;width:46px;height:46px;border-radius:10px;background:var(--gris)!important;border:2px solid var(--linea)!important;font:800 22px var(--display);display:grid;place-items:center;line-height:1}
.flecha.izq{left:0}.flecha.der{right:0}
.flecha:disabled{opacity:.3;cursor:default}
.npag{text-align:center;font:400 12px var(--mono);color:var(--ayuda);margin-top:10px}
.par2{display:grid;gap:8px;margin:8px 0}
.nw{white-space:nowrap}
.ej{padding:8px 16px;border-radius:12px;background:#F8F4EC;border-left:6px solid var(--bc,var(--teal))}
.ej .es{font:800 clamp(22px,2.8vw,29px)/1.25 var(--display);display:block}
.ej .en{display:block;font-size:16px}
.capas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.capa{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.capa svg{flex:none}
.capa>div{min-width:0}
.capa small{display:block;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.capa b{display:block;font:800 clamp(19px,2.2vw,24px)/1.1 var(--display)}
.capa span{display:block;font-size:16px;line-height:1.3;margin-top:3px}
.capa.e{background:var(--f1)} .capa.e small,.capa.e b{color:var(--esc)}
.capa.a{background:var(--f3)} .capa.a small,.capa.a b{color:var(--acc)}
.formas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formas>div{border-radius:14px;padding:10px 14px;min-width:0}
.formas h3{margin:0 0 4px;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.formas p{margin:0 0 4px;font:700 17px/1.35 var(--texto);overflow-wrap:anywhere}
.formas p small{font:400 14px var(--texto);color:var(--ayuda)}

/* huecos y elección */
.frase{font:800 clamp(25px,3.6vw,38px)/1.25 var(--display);margin:6px 0 14px;overflow-wrap:anywhere}
.frase u{text-decoration:none;display:inline-block;min-width:110px;border-bottom:5px solid var(--tinta);text-align:center;color:var(--teal)}
.frase small{display:block;font:400 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ayuda);margin-bottom:4px}
.ops{display:flex;flex-wrap:wrap;gap:10px}
.ops.col{flex-direction:column;align-items:stretch;max-width:720px}
.op{min-height:54px;padding:8px 22px;border-radius:14px;border:3px solid var(--linea);background:#fff;font:800 clamp(20px,2.4vw,25px)/1.15 var(--display);text-align:left;overflow-wrap:anywhere;min-width:0}
.op.txt{font:600 18px/1.25 var(--texto)}
.op.ok{border-color:var(--ok);background:var(--okf)}
.op.mal{border-color:var(--mal);background:var(--malf)}
.op.cazado{border-color:var(--mal);background:var(--malf);text-decoration:line-through;text-decoration-color:var(--mal);text-decoration-thickness:3px}

/* introducción */
.banner{border-radius:14px;overflow:hidden;background:#CFE4EE;max-height:23vh;min-height:110px;aspect-ratio:800/210;width:100%}
.banner svg{display:block;width:100%;height:100%}
.pasa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.pasa button{min-height:58px;min-width:0;padding:6px 10px;border-radius:12px;border:3px solid var(--linea);background:#fff;display:flex;align-items:center;gap:8px;text-align:left;font:600 16.5px/1.15 var(--texto);overflow-wrap:anywhere}
.pasa button span{font-size:24px;line-height:1;flex:none}
.pasa button.ya{border-color:var(--sol);background:#FFF5D8}
.cuenta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:10px}
.cuenta b{font:800 40px/1 var(--display);color:var(--rojo);min-width:30px;font-variant-numeric:tabular-nums}
.glosas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.glosabtn{min-height:40px;padding:0 16px;border-radius:20px;background:var(--tinta);color:#fff;font:700 17px var(--display)}
.metas{display:grid;gap:10px;margin:10px 0}
.meta{display:block;width:100%;text-align:left;border-radius:12px;background:#F8F4EC;border-left:6px solid var(--bc);padding:10px 16px}
.meta b{display:block;font:700 19px/1.25 var(--texto)}
.meta span{display:none;margin-top:4px;font:700 clamp(18px,2.2vw,23px)/1.2 var(--display);color:var(--teal)}
.meta.abierta span{display:block}
.meta small{font:400 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ayuda)}
.meta.abierta small{display:none}

/* trampas del inglés */
.trampas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.trampa{min-height:92px;border-radius:14px;border:3px solid var(--linea);background:#fff;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-width:0}
.trampa small{font:400 11px var(--mono);letter-spacing:.05em;color:var(--ayuda)}
.trampa b{font:600 19px/1.15 var(--texto);color:var(--ayuda);font-style:italic;overflow-wrap:anywhere}
.trampa.visto{border-color:var(--teal);background:#EFF8F7}
.contraste{display:grid;gap:8px;margin-top:6px}
.contraste div{padding:8px 14px;border-radius:10px;font:700 20px/1.25 var(--texto);overflow-wrap:anywhere}
.contraste .no{background:var(--malf);text-decoration:line-through;text-decoration-color:var(--mal)}
.contraste .si{background:var(--okf)}
.contraste small{display:inline-block;width:100%;font:400 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ayuda);text-decoration:none}

/* línea del tiempo */
.sec2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.tira{margin:0;padding:10px 12px 10px 46px;min-height:120px;border-radius:14px;background:var(--tinta);color:#fff;display:grid;gap:6px;align-content:start;counter-reset:t;list-style:none;position:relative}
.tira::before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:14px;background:repeating-linear-gradient(#ffffff55 0 8px,transparent 8px 16px);border-radius:3px}
.tira:empty::after{content:"Aquí va la historia, en orden.";color:#D3C7BA;font-style:italic;font-size:16px}
.tira li{counter-increment:t;background:#fff;color:var(--tinta);border-radius:9px;padding:6px 12px 6px 40px;font:600 17px/1.25 var(--texto);position:relative;overflow-wrap:anywhere}
.tira li::before{content:counter(t);position:absolute;left:8px;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;background:var(--f3);color:var(--acc);font:800 14px/24px var(--display);text-align:center}
.banco2{display:grid;gap:6px}
.hecho{min-height:46px;padding:6px 14px;border-radius:12px;border:3px solid var(--linea);background:#fff;font:600 17px/1.25 var(--texto);text-align:left;overflow-wrap:anywhere}

/* imagen + dado */
.imgdesc{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.imgdesc>div{min-width:0}
.imgdesc .marco{border-radius:14px;overflow:hidden;background:var(--gris);border:3px solid var(--linea)}
.imgdesc .marco svg,.imgdesc .marco img{display:block;width:100%;height:auto;max-height:54vh;object-fit:contain}
.orden{display:flex;align-items:center;gap:14px}
.orden>div{min-width:0}
.dado{flex:none;width:84px;height:84px;border-radius:18px;background:var(--rojo)!important;color:#fff!important;font:800 48px/1 var(--display);display:grid;place-items:center;box-shadow:inset 0 -8px 0 #0000002e}
@keyframes rueda{from{transform:rotate(-200deg) scale(.9)}to{transform:none}}
.dado.gira{animation:rueda .4s var(--ease-out)}
.preg{font:800 clamp(21px,2.6vw,27px)/1.15 var(--display);margin-top:4px;min-height:2.3em;overflow-wrap:anywhere}

/* libro */
.libro{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);border-radius:16px;overflow:hidden;border:3px solid #DDD2BD;background:#FFFDF8;min-height:300px}
.libro.solo{grid-template-columns:1fr}
.libro .ilu{background:#CFE4EE;display:grid;place-items:end center;border-right:3px solid #DDD2BD}
.libro .ilu svg{display:block;width:100%;height:auto}
.libro .hoja{position:relative;padding:20px clamp(16px,3vw,34px) 58px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.libro .tit{font:800 clamp(26px,3.3vw,38px)/1.1 var(--display);margin:0;overflow-wrap:anywhere;text-wrap:balance}
.libro .aut{font:400 13px var(--mono);letter-spacing:.03em;color:var(--ayuda);margin:6px 0 0;overflow-wrap:anywhere}
.libro .txt p{margin:0 0 .55em;font:400 var(--fs,22px)/1.5 var(--texto);overflow-wrap:anywhere}
.libro .nav{position:absolute;left:0;right:0;bottom:8px;display:flex;align-items:center;justify-content:center;gap:16px}
.libro .nav button{width:44px;height:44px;border-radius:50%;background:var(--tinta);color:#fff;font:800 19px var(--display);display:grid;place-items:center;line-height:1}
.libro .nav button:disabled{opacity:.25;cursor:default}
.libro .nav span{font:400 13px var(--mono);color:var(--ayuda);min-width:54px;text-align:center}
@keyframes hoja{from{opacity:.25}to{opacity:1}}
.libro .txt.pasa2{animation:hoja .16s ease-out}
.leer{max-width:74ch}
.leer p{margin:0 0 .4em;font:500 22px/1.7 var(--texto)}
.leer button{font:inherit;font-weight:700;border-bottom:4px solid var(--sol);padding:0 2px;border-radius:4px 4px 0 0;user-select:text;-webkit-user-select:text}
.leer button.fr{border-bottom-color:var(--teal2)}
.leer button.listo{background:var(--okf);border-bottom-color:var(--ok)}
.cajas{display:grid;gap:10px}
.caja{border-radius:14px;border:3px solid var(--linea);overflow:hidden}
.caja>button{width:100%;text-align:left;padding:11px 16px;font:800 19px var(--display);display:flex;gap:10px;align-items:center}
.caja>button:active{transform:none}
.caja>button i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--sol);display:grid;place-items:center;flex:none;line-height:1}
.caja>button small{margin-left:auto;font:400 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ayuda)}
.caja .den{display:none;padding:0 16px 14px}
.caja.abierta .den{display:block}
.caja.abierta{border-color:var(--sol);background:#FFFBEF}

/* juego */
.marcador{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:stretch}
.jug{flex:1;min-width:130px;border-radius:14px;border:3px solid var(--linea);padding:5px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 19px var(--display)}
.jug b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.jug.turno{border-color:var(--sol);background:#FFF5D8}
.jug.P.turno{border-color:var(--teal);background:#E6F4F3}
.sit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;background:var(--tinta);color:#fff;padding:8px 14px;margin-bottom:10px}
.sit small{font:400 11px var(--mono);letter-spacing:.06em;color:var(--sol)}
.sit b{font:700 clamp(18px,2.2vw,23px)/1.15 var(--display);flex:1;min-width:180px}
.sit .mini{border-color:#ffffff66;background:transparent;color:#fff}
.bingo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.casilla{min-height:64px;border-radius:12px;border:3px solid transparent;background:var(--fc);font:800 clamp(16px,1.9vw,20px)/1.1 var(--display);padding:4px 8px;display:grid;place-items:center;text-align:center;min-width:0;overflow-wrap:anywhere}
.casilla i{display:block;font:700 10.5px var(--mono);letter-spacing:.06em;font-style:normal;color:var(--tc);margin-bottom:2px}
.casilla.ab{background:#FFF5D8;border-color:var(--sol);cursor:default}
.casilla.ab.P{background:#E6F4F3;border-color:var(--teal)}
.casilla small{display:block;font:400 11px/1.25 var(--mono);color:var(--ayuda)}
.final{margin-top:12px;padding:12px 16px;border-radius:14px;background:#FFF5D8;border:3px solid var(--sol)}

/* tarea final */
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.plan>div{min-width:0}
.plan h3{margin:8px 0 5px;font:400 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ayuda)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:19px;border:2px solid var(--linea);background:#fff;font:600 16px var(--texto)}
.chip.sel{border-color:var(--tinta);background:var(--tinta);color:#fff}
.chip.u{background:var(--fc);border-color:transparent}
.chip.u.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.chip:disabled,.btn:disabled{opacity:.45;cursor:default}
.guion{border-radius:14px;background:#F8F4EC;padding:12px 16px;display:grid;gap:5px}
.guion p{margin:0;font:600 19px/1.3 var(--texto)}
.guion p b{font-family:var(--display);font-weight:800}
.reloj{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.reloj b{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums;min-width:96px}
.reloj b.fin{color:var(--rojo)}

/* clasificar */
.fichas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:46px}
.tok{min-height:42px;padding:0 14px;border-radius:12px;background:#EAE3D3;font:800 clamp(16px,1.9vw,20px) var(--display);line-height:1.1}
.fichas .tok.sel{outline:4px solid var(--sol)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colu{border-radius:14px;background:var(--fc);min-height:130px;padding:8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;text-align:center;border:3px solid transparent;align-items:flex-start;align-content:flex-start;justify-content:center}
.colu:active{transform:none}
.colu h3{margin:0 0 4px;font:800 19px var(--display);width:100%;color:var(--tc)}
.colu h3 small{display:block;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.colu span{background:#fff;border-radius:9px;padding:3px 10px;font:800 17px var(--display)}
.aprendi{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.aprendi li{padding-left:28px;position:relative}
.aprendi li::before{content:"";position:absolute;left:4px;top:.5em;width:12px;height:12px;background:var(--indigo);transform:rotate(45deg)}

/* pasos */
.pasos{display:grid;gap:10px}
.pasoq{display:flex;gap:12px;align-items:flex-start}
.pasoq>button{flex:none;width:50px;height:50px;border-radius:50%;background:var(--hoja);color:#fff;font:800 24px/1 var(--display);display:grid;place-items:center}
.pasoq>div{flex:1;min-width:0;border-radius:14px;background:#EEF6F1;padding:10px 16px;visibility:hidden;overflow-wrap:anywhere}
.pasoq.visto>div{visibility:visible}

/* tres pasos */
.pasos3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.pasos3 div{border-radius:14px;padding:10px 14px;min-width:0}
.pasos3 small{display:block;font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.pasos3 b{display:block;font:700 clamp(16px,1.8vw,20px)/1.2 var(--display);overflow-wrap:anywhere}
.pasos3 .f1 small,.pasos3 .f1 b{color:var(--esc)} .pasos3 .f2 small,.pasos3 .f2 b{color:var(--mid)} .pasos3 .f3 small,.pasos3 .f3 b{color:var(--acc)}
.duelo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.duelo>div{border-radius:14px;padding:10px 14px;min-width:0}
.duelo h3{margin:0 0 6px;font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.duelo p{margin:0 0 4px;font:700 19px/1.3 var(--texto);overflow-wrap:anywhere}
.duelo .no{background:var(--malf)} .duelo .no h3{color:#96241A} .duelo .si{background:var(--okf)} .duelo .si h3{color:#0D5F35}
/* ordenar la frase */
.dice2{border-radius:12px;background:var(--tinta);color:#fff;padding:8px 14px;margin-bottom:10px;font:700 clamp(17px,2vw,21px)/1.25 var(--display);overflow-wrap:anywhere}
.dice2 small{display:block;font:400 11px var(--mono);letter-spacing:.05em;color:var(--sol);text-transform:uppercase}
.linea{min-height:58px;border-bottom:4px solid var(--tinta);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;margin-bottom:14px}
.banco{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.tok2{min-height:44px;padding:0 14px;border-radius:12px;background:#EAE3D3;font:700 clamp(16px,1.8vw,19px) var(--display);line-height:1.1}
.linea .tok2{background:var(--f2)}
/* juego: la moneda */
.mesa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lado{min-height:46px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;font:800 clamp(18px,2.2vw,24px) var(--display);background:var(--gris);color:var(--ayuda)}
.lado.fav{background:var(--okf);color:#0D5F35} .lado.con{background:var(--malf);color:#96241A}
@keyframes cae{from{transform:translateY(-8px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
.lado.cae{animation:cae .2s var(--ease-out)}
.exps{display:flex;flex-wrap:wrap;gap:6px}
.cols.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.trampas.tres{grid-template-columns:repeat(3,minmax(0,1fr))}

/* emparejar */
.par{display:grid;grid-template-columns:1fr 1fr;gap:8px clamp(14px,5vw,60px);max-width:780px;margin:0 auto}
.par .col{display:grid;gap:7px}
.ficha2{min-height:44px;padding:4px 10px;border-radius:12px;border:3px solid var(--linea);background:#fff;font:800 clamp(19px,2.2vw,24px)/1.1 var(--display);display:grid;place-items:center;text-align:center;min-width:0;overflow-wrap:anywhere}
.ficha2.b{font:500 clamp(15px,1.7vw,18px)/1.15 var(--texto);color:var(--ayuda)}
.ficha2.sel{border-color:var(--sol);background:#FFF5D8}
.ficha2.hecho{border-color:var(--ok);background:var(--okf);cursor:default}
/* oye y toca */
.oye{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.foto2{min-height:128px;border-radius:14px;border:3px solid var(--linea);background:#fff;display:grid;place-items:center;text-align:center;padding:8px;min-width:0}
.foto2 .em{font-size:56px;line-height:1}
.foto2.ab{border-color:var(--sol);background:#FFF5D8}
.foto2.ab .em{font-size:30px}
.foto2 .tx b{display:block;font:800 clamp(19px,2.1vw,24px)/1.1 var(--display);overflow-wrap:anywhere}
.foto2 .tx small{display:block;font:400 14px/1.2 var(--texto);color:var(--ayuda);margin-top:2px}
.glosa-ord{font-size:18px;color:var(--ayuda);margin-bottom:8px}
.glosa-ord b{color:var(--tinta)}
/* hoy y ayer */
.hoyayer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.hoyayer>div{border-radius:14px;padding:10px 14px;min-width:0}
.hoyayer small{display:block;font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.hoyayer b{display:block;font:800 clamp(22px,2.8vw,30px)/1.15 var(--display);overflow-wrap:anywhere}
.hoyayer span{display:block;font-size:15.5px;color:var(--ayuda)}
.hoyayer .h{background:var(--f1)} .hoyayer .h small{color:var(--esc)} .hoyayer .a{background:var(--f3)} .hoyayer .a small{color:var(--acc)}
.cambio{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font:800 clamp(22px,2.8vw,30px)/1.2 var(--display)}
.cambio span{white-space:nowrap}
.cambio i{font-style:normal;color:var(--ayuda);font-weight:400}
/* mi viaje */
.viaje{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.viaje>div{min-width:0}
.vfila{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.vfila>b{font:800 21px var(--display);min-width:96px}
.frases p{margin:0 0 4px;font:800 clamp(20px,2.4vw,25px)/1.25 var(--display)}

/* video y bloques añadidos */
.video{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.video>div{min-width:0}
.poster{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;background:linear-gradient(135deg,#2A1F1A,#0F766E);display:grid;place-items:center;color:#fff;text-decoration:none;overflow:hidden}
.poster::before{content:"";width:86px;height:86px;border-radius:50%;background:var(--rojo);box-shadow:0 0 0 10px #ffffff2e}
.poster::after{content:"";position:absolute;border:19px solid transparent;border-left:30px solid #fff;border-right:0;margin-left:8px}
.poster em{position:absolute;left:12px;bottom:10px;font:400 12px var(--mono);font-style:normal;background:#000000a0;padding:2px 8px;border-radius:6px}
.poster:active{transform:scale(.99)}
.video .tiempos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.video .tiempos span{font:700 14px var(--mono);padding:4px 10px;border-radius:8px;background:var(--gris)}
.video a.btn{display:inline-flex;align-items:center;text-decoration:none}
.video .cred{font:400 12px var(--mono);letter-spacing:.03em;color:var(--ayuda);margin:0 0 4px}
.vacio{border:3px dashed var(--linea);border-radius:16px;padding:26px;text-align:center;color:var(--ayuda);overflow-wrap:anywhere}
.herr{display:none;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.editando .herr{display:flex}

/* ventana */
#velo{position:fixed;inset:0;background:#2A1F1Acc;display:grid;place-items:center;padding:16px;z-index:20}
@keyframes abre{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.popup{position:relative;background:#fff;border-radius:18px;max-width:580px;width:100%;max-height:92%;overflow:auto;overscroll-behavior:contain;padding:24px 24px 20px;box-shadow:0 20px 60px #0006;animation:abre .2s var(--ease-out)}
.popup .x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;background:var(--rojo);color:#fff;font:800 19px/1 var(--display);display:grid;place-items:center}
.popup h3{margin:0 40px 10px 0;font:800 25px/1.1 var(--display);overflow-wrap:anywhere}
.popup label{display:block;font:700 15px var(--texto);margin:10px 0 3px}
.popup label small{font-weight:400;color:var(--ayuda)}
.popup input[type=text],.popup textarea,.popup select{width:100%;font:400 17px var(--texto);padding:9px 12px;border:2px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
.popup input[type=file]{font-size:16px;max-width:100%}
.popup textarea{min-height:120px;resize:vertical}
.popup .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.popup .err{color:var(--mal);font-weight:700;font-size:15px;min-height:20px;margin-top:6px}
.glosa-pop{display:flex;gap:16px;align-items:center}
.glosa-pop>svg,.glosa-pop>span{flex:none}
.glosa-pop>div{min-width:0}
.glosa-pop b{font:800 30px/1.1 var(--display);display:block;overflow-wrap:anywhere}

@media (hover:hover) and (pointer:fine){
  .tnav button:hover:not(:disabled){background:#ffffff1f}
  .chipadd:hover{background:#EFF8F7!important}
  .colu:hover{border-color:var(--sol)}
  .op:not(.ok):not(.mal):not(.cazado):hover,.pasa button:not(.ya):hover,.trampa:not(.visto):hover,.hecho:hover{border-color:#B5A797}
  .it:hover{background:#ffffff12}
  button.casilla:hover{border-color:var(--tinta)}
}
@media (max-width:1180px){
  .cartas{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  body{font-size:17px}
  .tmenu{width:60px;justify-content:center;padding:0!important}.tmenu span{display:none}
  .tnav span,.guard,.tedit span{display:none}
  .tprog{display:none}
  #top{gap:6px}
  .crono{margin-left:auto}
  .imgdesc,.libro,.plan,.video,.sec2{grid-template-columns:1fr}
  .libro .ilu{border-right:0;border-bottom:3px solid #DDD2BD;max-height:150px;overflow:hidden}
  .pager{padding:0 0 60px}
  .flecha{top:auto;bottom:0;margin-top:0}
  .cartas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tarjeta{height:150px}
  .pasa,.trampas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bingo{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pasos3,.duelo,.cols.tres,.viaje{grid-template-columns:1fr}
  .oye{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trampas.tres{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trampa b{overflow-wrap:break-word}
  .cab .icono{width:60px}
  #escena{padding:8px}
  .popup .dos{grid-template-columns:1fr}
  .banner{max-height:none;min-height:0}
}
@media (max-width:600px){
  .pasa{grid-template-columns:1fr}
  .pasa button{min-height:46px}
  .capas,.formas{grid-template-columns:1fr}
  .par{gap:6px 8px}
  .cartas{grid-template-columns:1fr}
  .tarjeta{height:138px}
  .colu{min-height:84px}
  .bingo{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Un café, por favor (clase de prueba) =================
   Identidad: bar de barrio. Espresso, crema, teal y rojo de la marca, mostaza.
   Colores con función: azul = UN · naranja = UNA · verde = frases hechas.
   Gesto de la clase: cada sección hecha sella una taza en la tarjeta del bar (barra superior). */
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px);background:var(--tinta)}
#escena{overscroll-behavior:contain}
.tprog span{flex:none;display:grid}
@keyframes sello{from{transform:scale(1.5) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.tprog .sello{animation:sello .26s var(--ease-out)}
.ruta small{display:block;font:400 13.5px/1.2 var(--texto);color:var(--ayuda)}
.nota{margin:12px 0 0;padding:8px 14px;border-radius:10px;background:var(--f1);color:var(--esc);font:500 15.5px/1.35 var(--texto);overflow-wrap:anywhere}
.un{color:var(--esc)} .una{color:var(--acc)}

/* tarjetas: frente claro para que los iconos se lean en videollamada */
.frente{background:#FFFAF0;color:var(--tinta);border:3px solid var(--linea);border-bottom:8px solid var(--tc)}
.frente i{color:var(--ayuda)}
.frente em{display:grid;place-items:center;font-size:0;line-height:0;margin-bottom:2px}
.dorso{border-color:var(--tc)}
.dorso b{color:var(--tinta);font:700 19px/1.1 var(--texto)}
.dorso i{font-size:11.5px;color:var(--tc);font-weight:600}

/* introducción: lo que ya sabes */
.banner{max-height:16vh;min-height:96px}
.sabes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.sabes button{min-height:62px;min-width:0;padding:6px 10px;border-radius:12px;border:3px solid var(--linea);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;overflow-wrap:anywhere}
.sabes b{font:800 clamp(18px,2vw,22px)/1.1 var(--display)}
.sabes small{font:400 14px/1.2 var(--texto);color:var(--ayuda);visibility:hidden}
.sabes.ver small{visibility:visible}
.sabes button.ya{border-color:var(--sol);background:#FFF5D8}

/* objetivos: elige tus tres situaciones */
.rank{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:6px}
.rank button{position:relative;min-height:96px;min-width:0;border-radius:14px;border:3px solid var(--linea);background:#fff;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.rank .em{font-size:30px;line-height:1}
.rank .lb{font:600 16.5px/1.15 var(--texto);overflow-wrap:break-word;max-width:100%}
.rank i{position:absolute;top:-10px;right:-8px;width:34px;height:34px;border-radius:50%;background:var(--rojo);color:#fff;font:800 18px/34px var(--display);font-style:normal;text-align:center;transform:scale(.7);opacity:0;transition:transform .16s var(--ease-out),opacity .16s var(--ease-out)}
.rank button.ya{border-color:var(--tinta);background:#FFF5D8}
.rank button.ya i{transform:none;opacity:1}

/* un / una */
.op.un{border-color:#9FC0E2;color:var(--esc)} .op.una{border-color:#EDB98A;color:var(--acc)}
.op.un.ok,.op.una.ok{border-color:var(--ok);color:var(--tinta)} .op.un.mal,.op.una.mal{border-color:var(--mal);color:var(--tinta)}
.frase u.un{color:var(--esc)} .frase u.una{color:var(--acc)}
.frase .en{display:block;font:400 17px/1.3 var(--texto);margin-top:6px}

/* oye y toca, juego */
.foto2 .em{display:flex;gap:2px;justify-content:center;align-items:center;font-size:0;line-height:0}
.foto2.ab .em svg{width:32px;height:32px}
button.casilla{border-color:var(--linea);background:#FFFAF0;min-height:72px}
.casilla.ab span{display:block;font:800 24px/1.1 var(--display)}
.casilla.ab small{font-size:11.5px}

/* lectura */
.leer .q,.libro .txt .q{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ayuda);font-style:normal;margin-right:6px}

/* tarea final */
.cinco{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;counter-reset:c}
.cinco li{counter-increment:c;padding:4px 12px 4px 5px;border-radius:16px;background:var(--gris);font:500 15px/1.6 var(--texto);white-space:nowrap}
.cinco li::before{content:counter(c);display:inline-block;width:23px;height:23px;border-radius:50%;background:var(--tinta);color:#fff;font:600 13px/23px var(--mono);text-align:center;margin-right:6px}
.vfila>b{min-width:92px}
.frases h3{margin:0 0 6px;font:400 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ayuda)}
.frases p{display:flex;gap:10px;align-items:baseline}
.frases p i{flex:none;font:600 13px var(--mono);color:var(--ayuda);font-style:normal}

/* plan */
.num{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num b{font:800 clamp(44px,6vw,64px)/1 var(--display);color:var(--rojo);font-variant-numeric:tabular-nums;white-space:nowrap}
.num span{font:600 18px/1.2 var(--texto)}
.cubre{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.cubre span{padding:3px 10px;border-radius:14px;border:2px dashed var(--linea);font:500 14.5px/1.4 var(--texto);color:var(--ayuda)}
.cubre span.si{border:2px solid var(--ok);background:var(--okf);color:#0D5F35;font-weight:700}
.guion p.rec{font:400 17px/1.4 var(--texto)}
.guion p.rutina{padding:8px 12px;border-radius:10px;background:#fff;font:700 17px/1.3 var(--texto)}
.plan h3:first-child{margin-top:0}

@media (hover:hover) and (pointer:fine){
  .sabes button:not(.ya):hover,.rank button:not(.ya):hover,.chip:not(.sel):hover{border-color:#B5A797}
}
@media (max-width:900px){
  .sabes,.rank{grid-template-columns:repeat(2,minmax(0,1fr))}
  .banner{max-height:none;min-height:0}
  .rank{gap:10px}
  .rank button{padding:8px 4px}
  .rank .lb{font-size:14.5px}
}
@media (max-width:600px){
  .sabes button{min-height:54px}
  .rank button{min-height:84px}
}

.op svg{flex:none}
.ej .fam{padding:0 6px}
.par .col{gap:6px}
.ficha2{min-height:40px}
.leer p{font-size:21px;line-height:1.55;margin:0 0 .15em}
.sabes button{min-height:58px}
</style>
</head>
<body>
<meta name="robots" content="noindex, nofollow">
<div id="app">
  <header id="top">
    <button id="bMenu" class="tmenu" title="Mostrar u ocultar el menú (tecla S)" aria-label="Mostrar u ocultar el menú">
      <svg width="30" height="30" viewBox="0 0 732 732" aria-hidden="true" focusable="false"><circle cx="366" cy="366" r="338" fill="#F8F8F8"/><circle cx="366" cy="366" r="338" fill="none" stroke="#6FC0AB" stroke-width="40"/><g transform="translate(338 382) scale(1.1) translate(-366 -380)"><path d="M186 452 C158 404, 154 350, 178 302 C212 236, 286 190, 368 184 C408 181, 446 189, 472 199" fill="none" stroke="#1A6FAF" stroke-width="30" stroke-linecap="round"/><path d="M470 212 C420 194, 366 188, 322 196 C238 212, 176 268, 165 348 C158 402, 176 454, 212 488 C221 497, 223 506, 217 519 C207 543, 192 562, 185 572 C178 581, 184 590, 194 585 C233 570, 269 558, 303 556 L470 556 Z" fill="#14C49B"/><path d="M462 206 L628 322 L462 438 Z" fill="#F52323" stroke="#F52323" stroke-width="10" stroke-linejoin="round"/><circle cx="398" cy="282" r="25" fill="#111"/><circle cx="406" cy="274" r="7" fill="#fff"/></g></svg>
      <span id="lMenu">Ocultar el menú</span>
    </button>
    <nav class="tnav" aria-label="Navegación">
      <button id="bAnt" title="Anterior (←)"><i>◀</i><span>Anterior</span></button>
      <button id="bInicio" title="Ir al inicio" aria-label="Ir al inicio"><i>⌂</i></button>
      <button id="bSig" title="Siguiente (→)"><span>Siguiente</span><i>▶</i></button>
    </nav>
    <div class="tprog" id="prog" title="Secciones hechas"></div>
    <button id="crono" class="crono" title="Cronómetro: clic para iniciar o pausar">8:00</button>
    <span id="guard" class="guard">CONECTANDO…</span>
    <button id="bEditar" class="tedit" title="Añadir video, imagen, cuento o pregunta">＋ <span>Añadir</span></button>
  </header>
  <aside id="lado" aria-label="Mapa de la clase">
    <div class="ficha">
      <b>Un café, por favor</b>
      <span>English · A1 · 50 min</span>
      <span>Clase de prueba · pedir en un bar</span>
    </div>
    <div class="indice" id="indice"></div>
    <button class="vaciar" id="bVaciar">VACIAR LA SESIÓN</button>
  </aside>
  <main id="escena"><div class="lamina" id="lamina"></div></main>
</div>
<div id="velo" hidden><div class="popup" role="dialog" aria-modal="true"><button class="x" id="popX" aria-label="Cerrar">✕</button><div id="popC"></div></div></div>
<script>
(()=>{
'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baraja=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TITULO='Un café, por favor';

/* sello de café: la pieza de progreso de esta clase. Cada sección hecha sella una taza en la tarjeta del bar. */
const TAZA='<path d="M6 12h17v6.5a8.5 8.5 0 0 1-17 0z"/><path d="M23 13.6h1.6a3.4 3.4 0 0 1 0 6.8h-2" fill="none" stroke-width="2.4"/><path d="M4 28.6h21" fill="none" stroke-width="2.6" stroke-linecap="round"/>';
const foto=(lleno,s=24,c='#EFB23A')=>lleno
 ?`<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><g fill="${c}" stroke="${c}" transform="translate(1.5 0)">${TAZA}<path d="M11 8.6q-2-2.5 0-5M17.5 8.6q-2-2.5 0-5" fill="none" stroke-width="2" stroke-linecap="round"/></g></svg>`
 :`<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#ffffff66" stroke-width="2" transform="translate(1.5 0)"><path d="M6 12h17v6.5a8.5 8.5 0 0 1-17 0z"/><path d="M23 13.6h1.6a3.4 3.4 0 0 1 0 6.8h-2"/><path d="M4 28.6h21" stroke-linecap="round"/></g></svg>`;
const MANO='<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="3 3"/><path d="M9 9l11 4-4.5 2.2L13 20z" fill="#2A1F1A"/></svg>';
const IC={
 intro:'<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6h24v16H14l-7 6v-6H4z" fill="#fff"/><path d="M13 12a3 3 0 1 1 4.5 2.6c-1 .6-1.5 1.1-1.5 2.4M16 19.5v.5" fill="none" stroke="#D2603F" stroke-width="2.4" stroke-linecap="round"/></svg>',
 obj:'<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#fff" stroke-width="3"/><circle cx="16" cy="16" r="6" fill="none" stroke="#fff" stroke-width="3"/><circle cx="16" cy="16" r="2" fill="#fff"/></svg>',
 cont:'<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7c5-2 9-1 13 2 4-3 8-4 13-2v17c-5-2-9-1-13 2-4-3-8-4-13-2z" fill="#fff"/><path d="M16 9v17" stroke="#0F766E" stroke-width="2"/></svg>',
 res:'<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="5" width="20" height="24" rx="3" fill="#fff"/><rect x="11" y="2" width="10" height="6" rx="2" fill="#fff" stroke="#2F6690" stroke-width="1.5"/><path d="M10 14h12M10 19h12M10 24h8" stroke="#2F6690" stroke-width="2.2" stroke-linecap="round"/></svg>',
 tarea:'<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15L16 4l12 11v13H4z" fill="#fff"/><rect x="13" y="18" width="6" height="10" fill="#3B8751"/></svg>'
};
const MOM={intro:{n:'INTRODUCTION',c:'var(--coral)'},obj:{n:'GOALS',c:'var(--ambar)'},cont:{n:'ACTIVITY',c:'var(--teal)'},res:{n:'SUMMARY',c:'var(--indigo)'},tarea:{n:'HOMEWORK',c:'var(--hoja)'}};
/* textos de los bloques que añade el profesor, en la lengua de las consignas de este estudiante (A1: inglés) */
const TXT={video:'Watch the clip with your teacher.',imagen:'Roll the die and say it out loud. Your teacher answers.',cuento:'Read with your teacher. Tap the arrows to turn the page.',pregunta:'Listen, think and answer out loud.',
  abrir:'Open the video',verdesde:'Start at',verhasta:'Stop at',dado:'Roll the die',estrella:'I said it!',hablar:'Let’s talk',ayuda:'Need help?'};

/* ================= estado ================= */
const nuevoEstado=()=>({pantalla:0,tab:0,hechas:[],juego:null,final:{},actualizado:0});
let estado=nuevoEstado();
let contenido={extras:{},fijos:{},actualizado:0};
const mediaMem=new Map();
let db=null,aplicando=false,editando=false,ultimoSello=null;
const cache=new Map();
const guard=$('#guard');
const marca=(t,c)=>{guard.textContent=t;guard.className='guard '+(c||'')};
function escritor(ruta,datos){let t=null,ocupado=false,sucio=false;
  async function ya(){if(ocupado){sucio=true;return}ocupado=true;
    try{await db.doc(ruta).set(JSON.parse(JSON.stringify(datos())));marca('GUARDADO','ok')}catch(e){marca('SOLO ESTA SESIÓN')}
    ocupado=false;if(sucio){sucio=false;ya()}}
  return()=>{if(aplicando)return;if(!db){marca('SOLO ESTA SESIÓN');return}marca('GUARDANDO…');clearTimeout(t);t=setTimeout(ya,500)}}
const _gE=escritor('sesion/estado',()=>estado),_gC=escritor('sesion/contenido',()=>contenido);
const guardar=()=>{if(aplicando)return;estado.actualizado=Date.now();_gE()};
const guardarContenido=()=>{contenido.actualizado=Date.now();_gC()};
async function guardarMedia(id,d){mediaMem.set(id,d);if(db){try{await db.doc('media/'+id).set({d})}catch(e){marca('SOLO ESTA SESIÓN')}}}
async function leerMedia(id){if(!id)return null;if(mediaMem.has(id))return mediaMem.get(id);if(!db)return null;
  try{const s=await db.doc('media/'+id).get();if(s.exists){const d=s.data().d;mediaMem.set(id,d);return d}}catch(e){}return null}
async function conectar(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){marca('SOLO ESTA SESIÓN');return}
  marca('GUARDADO','ok');
  db.doc('sesion/estado').onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const d=s.data();
    if(!d||!(d.actualizado>estado.actualizado))return;
    const antes=estado.pantalla;aplicando=true;estado=Object.assign(nuevoEstado(),JSON.parse(JSON.stringify(d)));
    if(!Array.isArray(estado.hechas))estado.hechas=[];if(!estado.final||typeof estado.final!=='object')estado.final={};
    [...cache.keys()].filter(k=>/^(obj|a6|res)\//.test(k)).forEach(k=>cache.delete(k));
    if(estado.pantalla!==antes)reiniciaCrono();pintar();aplicando=false},()=>marca('SOLO ESTA SESIÓN'));
  db.doc('sesion/contenido').onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const d=s.data();
    if(!d||!(d.actualizado>contenido.actualizado))return;
    contenido=Object.assign({extras:{},fijos:{}},JSON.parse(JSON.stringify(d)));
    if(!contenido.extras||typeof contenido.extras!=='object')contenido.extras={};if(!contenido.fijos||typeof contenido.fijos!=='object')contenido.fijos={};
    cache.clear();pintar()},()=>{});
}

/* ================= ventana ================= */
const velo=$('#velo'),popC=$('#popC');let antesFoco=null;
function abrir(html){antesFoco=document.activeElement;popC.innerHTML=html;popC.onpaste=null;velo.hidden=false;const f=$('input,textarea,button:not(.x)',popC);(f||$('#popX')).focus()}
function cerrar(){velo.hidden=true;popC.innerHTML='';if(antesFoco&&document.contains(antesFoco))antesFoco.focus()}
$('#popX').onclick=cerrar;velo.addEventListener('click',e=>{if(e.target===velo)cerrar()});

/* ================= secciones ================= */
const SECS=[];   // se llena al final
const extrasDe=id=>Array.isArray(contenido.extras[id])?contenido.extras[id]:[];
const ICX={video:'▶',imagen:'▣',cuento:'❡',pregunta:'?'};
function tabsDe(s){
  const base=s.tabs.filter(t=>!t.si||t.si());
  const ex=extrasDe(s.id).filter(b=>b&&FORM[b.tipo]).map(b=>({k:'x'+b.id,lab:ICX[b.tipo],extra:b,instr:TXT[b.tipo],r:(el,api)=>rExtra(el,api,b,s)}));
  return base.concat(ex)}
const hecha=id=>estado.hechas.includes(id);
const lam=$('#lamina');
function pintar(){
  if(!(estado.pantalla>=0&&estado.pantalla<SECS.length))estado.pantalla=0;
  const s=SECS[estado.pantalla],tabs=tabsDe(s);
  if(!(estado.tab>=0&&estado.tab<tabs.length))estado.tab=0;
  const t=tabs[estado.tab],m=MOM[s.m];
  lam.style.setProperty('--mcol',m.c);
  lam.innerHTML=`<header class="cab"><div class="icono">${IC[s.m]}</div><h1>${TITULO}</h1></header>
   <div class="tagrow"><div class="tag">${m.n}${s.n?`<i>${s.n}</i>`:''}</div><div class="sub">${s.t}</div><div class="min">${s.min} MIN</div>
     <div class="tabs" role="tablist">${tabs.length>1?tabs.map((x,i)=>`<button role="tab" class="${x.extra?'extra':''}" aria-selected="${i===estado.tab}" data-t="${i}">${x.lab||i+1}</button>`).join(''):''}</div></div>
   <div class="instr">${MANO}<span>${t.instr||s.instr||''}</span></div>
   <div class="panel" id="panel"></div>
   <div class="pie"><div class="editbar"><b>Añadir aquí</b>
       <button class="chipadd" data-add="video">▶ Video de YouTube</button><button class="chipadd" data-add="imagen">▣ Imagen para describir</button>
       <button class="chipadd" data-add="cuento">❡ Cuento</button><button class="chipadd" data-add="pregunta">? Pregunta</button></div>
     <button class="hecha ${hecha(s.id)?'si':''}" id="bHecha">${hecha(s.id)?'Done '+foto(true,22,'#fff'):'Mark as done '+foto(true,22)}</button></div>`;
  const clave=s.id+'/'+t.k;let nodo=cache.get(clave);
  if(!nodo){nodo=document.createElement('div');cache.set(clave,nodo);t.r(nodo,{pager:p=>nodo._pager=p,sec:s})}
  $('#panel').appendChild(nodo);
  $$('.tabs button',lam).forEach(b=>b.onclick=()=>{estado.tab=+b.dataset.t;pintar();guardar()});
  const sel=$('.tabs button[aria-selected="true"]',lam);if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest',inline:'nearest'});
  $$('[data-add]',lam).forEach(b=>b.onclick=()=>editarBloque(s,{tipo:b.dataset.add},true));
  $('#bHecha').onclick=()=>{const i=estado.hechas.indexOf(s.id);if(i<0){estado.hechas.push(s.id);ultimoSello=s.id}else estado.hechas.splice(i,1);pintar();guardar()};
  pintarIndice();pintarProg();
  $('#bAnt').disabled=estado.pantalla===0&&estado.tab===0;
}
const corto=s=>s.m==='intro'?'¿?':s.m==='obj'?'◎':s.m==='res'?'≡':s.m==='tarea'?'⌂':s.n;
function pintarIndice(){
  $('#indice').innerHTML=SECS.map((s,i)=>`<button class="it ${i===estado.pantalla?'on':''} ${hecha(s.id)?'ok':''}" data-i="${i}" style="--mcol:${MOM[s.m].c}" title="${esc(s.t)}"><span class="pt2">${hecha(s.id)?'✓':corto(s)}</span><span class="tx"><small>${MOM[s.m].n}${s.n?' '+s.n:''} · ${s.min} MIN</small>${s.t}</span></button>`).join('');
  $$('#indice .it').forEach(b=>b.onclick=()=>irA(+b.dataset.i,0));
}
function pintarProg(){const u=ultimoSello;ultimoSello=null;$('#prog').innerHTML=SECS.map(s=>`<span class="${s.id===u?'sello':''}">${foto(hecha(s.id),26)}</span>`).join('')}
function irA(i,tab){estado.pantalla=i;estado.tab=tab==='ultima'?tabsDe(SECS[i]).length-1:(tab||0);reiniciaCrono();pintar();$('#escena').scrollTop=0;guardar()}
function avanzar(d){
  const s=SECS[estado.pantalla],tabs=tabsDe(s),nodo=cache.get(s.id+'/'+(tabs[estado.tab]||{}).k);
  if(nodo&&nodo._pager&&nodo._pager.mover(d))return;
  const nt=estado.tab+d;if(nt>=0&&nt<tabs.length){estado.tab=nt;pintar();$('#escena').scrollTop=0;guardar();return}
  const np=estado.pantalla+d;if(np>=0&&np<SECS.length)irA(np,d<0?'ultima':0)}
$('#bAnt').onclick=()=>avanzar(-1);$('#bSig').onclick=()=>avanzar(1);$('#bInicio').onclick=()=>irA(0,0);

/* menú, edición, vaciar, teclado */
const app=$('#app');
function plegar(v){app.classList.toggle('plegado',v);$('#lMenu').textContent=v?'Mostrar el menú':'Ocultar el menú'}
$('#bMenu').onclick=()=>plegar(!app.classList.contains('plegado'));
if(window.innerWidth<900)plegar(true);
$('#bEditar').onclick=()=>{editando=!editando;document.body.classList.toggle('editando',editando);$('#bEditar').innerHTML=editando?'✓ <span>Listo</span>':'＋ <span>Añadir</span>'};
let armado=null;const bV=$('#bVaciar');
bV.onclick=()=>{if(!armado){bV.classList.add('arma');bV.textContent='¿SEGURO? PULSA OTRA VEZ';armado=setTimeout(()=>{armado=null;bV.classList.remove('arma');bV.textContent='VACIAR LA SESIÓN'},3500);return}
  clearTimeout(armado);armado=null;bV.classList.remove('arma');bV.textContent='VACIAR LA SESIÓN';estado=nuevoEstado();cache.clear();reiniciaCrono();pintar();guardar()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!velo.hidden){cerrar();return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||!velo.hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();avanzar(1)}else if(e.key==='ArrowLeft'){e.preventDefault();avanzar(-1)}
  else if(e.key==='s'||e.key==='S')plegar(!app.classList.contains('plegado'))});

/* cronómetro */
let resta=0,corre=false,tic=null;const cr=$('#crono');
function pintaCrono(){const a=Math.abs(resta),m=a/60|0,s=String(a%60).padStart(2,'0');cr.textContent=(resta<0?'+':'')+m+':'+s;cr.classList.toggle('pasado',resta<0);cr.classList.toggle('va',corre&&resta>=0)}
function reiniciaCrono(){clearInterval(tic);corre=false;resta=(SECS[estado.pantalla]||{min:0}).min*60;pintaCrono()}
cr.onclick=()=>{corre=!corre;clearInterval(tic);if(corre)tic=setInterval(()=>{resta--;pintaCrono()},1000);pintaCrono()};

/* ================= motores de ejercicio ================= */
const temblar=b=>{b.classList.remove('tiembla');void b.offsetWidth;b.classList.add('tiembla')};
const rutasHTML=(rs,oculto)=>oculto
  ?`<button class="ayudabtn">${TXT.ayuda}</button><div class="rutas" hidden>${rs.map(r=>`<span class="ruta">${r}</span>`).join('')}</div>`
  :`<div class="rutas">${rs.map(r=>`<span class="ruta">${r}</span>`).join('')}</div>`;
const activaAyuda=root=>$$('.ayudabtn',root).forEach(b=>b.onclick=()=>{const r=b.nextElementSibling;r.hidden=!r.hidden});

function serie(root,n,pinta,cierre){
  let i=0,hechos=0;
  root.innerHTML=`<div class="sitem"></div><div class="fb" aria-live="polite"></div><div class="fila"><span class="pts"></span><span class="hueco"></span><button class="mini re">↻ Start again</button><button class="btn sig" hidden>Next ▸</button></div>`;
  const item=$('.sitem',root),fbx=$('.fb',root),sig=$('.sig',root),pts=$('.pts',root);
  const pp=()=>pts.innerHTML=foto(true,22,'#0F766E')+' '+hechos+' / '+n;

function paginar(texto,max){
  const paras=String(texto).replace(/\r/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean),pags=[];let cur=[],len=0;
  for(const p of paras){const fr=p.match(/[^.!?…]+[.!?…]+["»”’)]*\s*|[^.!?…]+$/g)||[p];let buf='';const tr=[];
    for(let f of fr){while(f.length>max){if(buf.trim()){tr.push(buf.trim());buf=''}tr.push(f.slice(0,max));f=f.slice(max)}
      if((buf+f).length>max&&buf){tr.push(buf.trim());buf=f}else buf+=f}
    if(buf.trim())tr.push(buf.trim());
    for(const t of tr){if(len+t.length>max&&cur.length){pags.push(cur);cur=[];len=0}cur.push(t);len+=t.length}}
  if(cur.length)pags.push(cur);return pags.length?pags:[['']]}
function rLibro(root,api,c,ilu){
  const max={corta:140,media:340,larga:700}[c.pag||'media']||340,pags=paginar(c.texto,max);let i=-1;

  const tx=$('.txt',root),a=$('.a',root),s=$('.s',root);
  function ver(){tx.classList.remove('pasa2');void tx.offsetWidth;tx.classList.add('pasa2');
    tx.innerHTML=i<0?`<h2 class="tit">${esc(c.titulo||'Sin título')}</h2><p class="aut">${esc([c.autor,c.fuente].filter(Boolean).join(' · '))}</p>`:pags[i].map(p=>`<p>${esc(p)}</p>`).join('');
    a.disabled=i<0;s.disabled=i===pags.length-1;$('.nav span',root).textContent=i<0?'':(i+1)+' / '+pags.length}
  const mover=d=>{const n=i+d;if(n<-1||n>=pags.length)return false;i=n;ver();return true};
  a.onclick=()=>mover(-1);s.onclick=()=>mover(1);api.pager({mover});ver()}

function ytId(u){const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?m[1]:null}
function aSeg(t){t=String(t||'').trim();if(!t)return 0;const p=t.split(':').map(Number);if(p.some(x=>isNaN(x)||x<0))return 0;return Math.round(p.reduce((a,b)=>a*60+b,0))}
const mmss=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');

function comprimir(file){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=ko;fr.onload=()=>{const img=new Image();img.onerror=ko;img.onload=()=>{
  let max=1280,q=.82,d='';for(let k=0;k<9;k++){const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if(d.length<230000)break;max=Math.round(max*.82);q=Math.max(.6,q-.05)}
  d.length<250000?ok(d):ko(new Error('grande'))};img.src=fr.result};fr.readAsDataURL(file)})}

function editarBloque(s,b,nuevo,alGuardar){
  const F=FORM[b.tipo];let dataImg=null,ocupado=false;
  abrir(`<h3>${F.t}</h3>${F.c}<div class="err" id="f_err" aria-live="polite"></div><div class="fila"><span class="hueco"></span><button class="mini" id="f_no">Cancelar</button><button class="btn" id="f_ok">Guardar</button></div>`);
  F.k.forEach(k=>{const e=$('#f_'+k);if(e&&b[k]!=null&&b[k]!=='')e.value=b[k]});
  const err=m=>$('#f_err').textContent=m;
  if(b.tipo==='imagen'){const pv=$('#f_prev');
    const toma=async f=>{if(!f||!/^image\//.test(f.type)){err('Ese archivo no es una imagen.');return}err('Preparando la imagen…');ocupado=true;
      try{dataImg=await comprimir(f);pv.innerHTML=`<img src="${dataImg}" alt="" style="max-height:150px;max-width:100%;border-radius:10px">`;err('')}catch(e){err('No pude preparar esa imagen. Prueba con un JPG o PNG más pequeño.')}ocupado=false};
    $('#f_file').onchange=e=>toma(e.target.files[0]);
    popC.onpaste=e=>{const f=[...(e.clipboardData&&e.clipboardData.files||[])][0];if(f){e.preventDefault();toma(f)}};
    if(b.media)leerMedia(b.media).then(d=>{if(d&&!dataImg&&pv.isConnected)pv.innerHTML=`<img src="${d}" alt="" style="max-height:150px;max-width:100%;border-radius:10px">`})}
  $('#f_no').onclick=cerrar;
  $('#f_ok').onclick=async()=>{
    if(ocupado)return err('Espera un momento: la imagen se está preparando.');
    const v={};F.k.forEach(k=>v[k]=$('#f_'+k).value.trim());
    if(b.tipo==='video'&&!ytId(v.url))return err('Pega un enlace de YouTube completo (youtube.com/watch?v=… o youtu.be/…).');
    if(b.tipo==='imagen'&&!dataImg&&!b.media)return err('Elige una imagen primero.');

    if(b.tipo==='pregunta'&&!v.texto)return err('Escribe la pregunta.');
    if(JSON.stringify(contenido).length+JSON.stringify(v).length>230000)return err('Este tablero ya tiene mucho material añadido. Quita un bloque antes de guardar este.');
    Object.assign(b,v);
    if(dataImg){b.media=uid();await guardarMedia(b.media,dataImg)}
    if(alGuardar){alGuardar(b)}
    else{if(nuevo){b.id=uid();if(!Array.isArray(contenido.extras[s.id]))contenido.extras[s.id]=[];contenido.extras[s.id].push(b)}
      cache.clear();if(nuevo)estado.tab=tabsDe(s).length-1}
    cerrar();pintar();guardarContenido()}}

<script>
/* Vista previa · Lingua's Academy. Iconos: Lucide, ISC */
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("vp-datos").textContent);
  var T = {
    es:{cinta:"Vista previa",cintaTxt:"Ves el principio de la clase.",verResto:"Ver el resto de la clase",finT:"Hasta aquí la vista previa",
      finTxt:"El resto de la clase (actividades, lectura, juego, resumen y tarea) está disponible con la suscripción.",suscribir:"Desbloquear con la suscripción",
      seguir:"Seguir en la vista previa",lado:"En la clase completa",bloq:"Bloqueado: ",m:{intro:"Introducción",obj:"Objetivos",cont:"Contenido",res:"Resumen",tarea:"Tarea"}},
    en:{cinta:"Preview",cintaTxt:"You're seeing the start of the lesson.",verResto:"See the rest of the lesson",finT:"This is where the preview ends",
      finTxt:"The rest of the lesson (activities, reading, game, review and homework) is available with a subscription.",suscribir:"Unlock with a subscription",
      seguir:"Keep exploring the preview",lado:"In the full lesson",bloq:"Locked: ",m:{intro:"Warm-up",obj:"Goals",cont:"Content",res:"Review",tarea:"Homework"}},
    pt:{cinta:"Prévia",cintaTxt:"Você está vendo o começo da aula.",verResto:"Ver o resto da aula",finT:"A prévia termina aqui",
      finTxt:"O resto da aula (atividades, leitura, jogo, resumo e tarefa) está disponível com a assinatura.",suscribir:"Desbloquear com a assinatura",
      seguir:"Continuar na prévia",lado:"Na aula completa",bloq:"Bloqueado: ",m:{intro:"Introdução",obj:"Objetivos",cont:"Conteúdo",res:"Resumo",tarea:"Tarefa"}}
  };
  var L = "es";
  try { L = new URLSearchParams(location.search).get("lang") || localStorage.getItem("la-lang") || ""; } catch (e) {}
  if (!T[L]) { var nv = String(navigator.language || "").toLowerCase(); L = nv.indexOf("pt") === 0 ? "pt" : nv.indexOf("en") === 0 ? "en" : "es"; }
  var t = T[L];
  var COL = {intro:["--terra","#C2533A","--terraf","#F8E3DC"],obj:["--mostaza","#D6992A","--mostazaf","#FBEFD6"],cont:["--mar","#1B7A88","--marf","#DDEFF1"],res:["--ciruela","#6D4B80","--ciruelaf","#ECE3F2"],tarea:["--verde","#4A8656","--verdef","#E1F0E3"]};
  var CANDADO = '<svg class="vp-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  function nombre(b){ return b.t || t.m[b.m]; }
  document.querySelectorAll("[data-vp]").forEach(function(el){ var k = el.getAttribute("data-vp"); if (t[k]) el.textContent = t[k]; });
  var cinta = document.getElementById("vp-cinta"); cinta.setAttribute("aria-label", t.cinta);
  document.body.classList.add("vp-con-cinta");
  var ir = document.getElementById("vp-ir");
  ir.href = D.suscripcion + (L !== "es" ? "?lang=" + L : "");

  /* la lámina final */
  var dlg = document.getElementById("vp-fin"), lista = document.getElementById("vp-fin-lista");
  D.bloqueadas.forEach(function(b){
    var li = document.createElement("li"), c = COL[b.m] || COL.cont;
    li.style.setProperty("--cf", "var(" + c[2] + "," + c[3] + ")");
    li.innerHTML = CANDADO + '<span class="vp-m"></span><span class="vp-tt"></span>';
    li.children[1].textContent = t.m[b.m]; li.children[2].textContent = nombre(b);
    lista.appendChild(li);
  });
  function abrir(){
    if (dlg.open) return;
    if (typeof dlg.showModal === "function") { try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); } } else dlg.setAttribute("open", "");
    ir.focus();
  }
  function cerrar(){ if (typeof dlg.close === "function" && dlg.open) dlg.close(); else dlg.removeAttribute("open"); }
  window.LA_VISTA_PREVIA = { abrir: abrir, cerrar: cerrar };
  cinta.querySelector("[data-vp-abrir]").addEventListener("click", abrir);
  dlg.querySelector("[data-vp-cerrar]").addEventListener("click", cerrar);
  dlg.addEventListener("click", function(e){ if (e.target === dlg) cerrar(); });

  /* el menú lateral: las secciones bloqueadas, con candado */
  function bloqueLado(){
    var d = document.createElement("div"); d.id = "vp-lado";
    d.innerHTML = '<h3>' + CANDADO + '<span></span></h3><ol></ol>';
    d.querySelector("h3 span").textContent = t.lado;
    var ol = d.querySelector("ol");
    D.bloqueadas.forEach(function(b){
      var li = document.createElement("li"), bt = document.createElement("button"), c = COL[b.m] || COL.cont;
      bt.type = "button"; bt.style.setProperty("--c", "var(" + c[0] + "," + c[1] + ")");
      bt.setAttribute("aria-label", t.bloq + t.m[b.m] + " · " + nombre(b));
      bt.innerHTML = '<span class="vp-pt" aria-hidden="true"></span><span class="vp-tt"></span>' + (b.min ? '<span class="vp-min"></span>' : "") + CANDADO;
      bt.querySelector(".vp-tt").textContent = nombre(b);
      if (b.min) bt.querySelector(".vp-min").textContent = b.min + " min";
      bt.addEventListener("click", abrir);
      li.appendChild(bt); ol.appendChild(li);
    });
    return d;
  }
  var lado = document.getElementById("lado") || document.querySelector("aside, nav#mapa, #mapa, .mapa");
  if (lado) {
    var puesto = bloqueLado(); lado.appendChild(puesto);
    new MutationObserver(function(){ if (!lado.contains(puesto)) { puesto = bloqueLado(); lado.appendChild(puesto); } }).observe(lado, { childList: true, subtree: true });
  }

  /* «Siguiente» al final de lo que se ve: en vez de no hacer nada, abre la lámina bloqueada */
  var zona = function(){ return document.getElementById("lamina") || document.querySelector("main") || document.getElementById("app") || document.body; };
  var firma = function(){ var z = zona(); return z ? z.innerHTML.length + ":" + z.innerHTML.slice(0, 4000) + location.hash : ""; };
  function esSiguiente(el){
    if (!el || el.closest("#vp-cinta, #vp-fin, #vp-lado")) return false;
    var b = el.closest("button, a, [role=button]"); if (!b) return false;
    var id = (b.id || "") + " " + (b.getAttribute("data-accion") || "") + " " + (b.getAttribute("aria-label") || "") + " " + (b.getAttribute("title") || "");
    var txt = (b.textContent || "").trim();
    return /(^|\s)(bSig|bSiguiente|sig|siguiente|next)(\s|$)/i.test(id) || /^siguiente\b/i.test(id.trim()) || /^(siguiente|next|próximo)\b/i.test(txt);
  }
  function vigila(){
    var antes = firma();
    setTimeout(function(){ if (!dlg.open && firma() === antes) abrir(); }, 220);
  }
  document.addEventListener("click", function(e){ if (esSiguiente(e.target)) vigila(); }, true);
  document.addEventListener("keydown", function(e){
    if (e.key !== "ArrowRight" || e.altKey || e.ctrlKey || e.metaKey || dlg.open) return;
    var a = document.activeElement; if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return;
    vigila();
  }, true);
  /* si el tablero apaga «Siguiente» en la última pantalla, se deja encendido para llegar a la lámina final */
  function encender(){
    document.querySelectorAll("button[disabled], [aria-disabled=true]").forEach(function(b){
      if (esSiguiente(b)) { b.disabled = false; b.removeAttribute("aria-disabled"); }
    });
  }
  new MutationObserver(encender).observe(document.body, { attributes: true, subtree: true, attributeFilter: ["disabled", "aria-disabled"] });
  encender();
})();
</script>
